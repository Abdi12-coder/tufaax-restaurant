<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍳 Tufaax Kitchen Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: #1e1e2e;
            color: white;
        }
        
        .order-card {
            background: #2d2d3a;
            border-left: 6px solid;
            transition: all 0.2s;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .status-pending { border-left-color: #f59e0b; }
        .status-preparing { border-left-color: #3b82f6; }
        .status-ready { border-left-color: #10b981; }
        .status-completed { border-left-color: #6b7280; opacity: 0.7; }
        
        .badge {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge-pending { background: #f59e0b20; color: #f59e0b; border: 1px solid #f59e0b40; }
        .badge-preparing { background: #3b82f620; color: #3b82f6; border: 1px solid #3b82f640; }
        .badge-ready { background: #10b98120; color: #10b981; border: 1px solid #10b98140; }
        .badge-completed { background: #6b728020; color: #9ca3af; border: 1px solid #6b728040; }
        
        .kitchen-header {
            background: linear-gradient(135deg, #2d2d3a, #1e1e2e);
            border-bottom: 3px solid #f59e0b;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 1rem 2rem;
            border-radius: 999px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 9999;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .order-item {
            background: #3d3d4a;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 6px;
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .btn-status {
            transition: all 0.2s;
        }
        
        .btn-status:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .new-order-alert {
            background: #f59e0b;
            animation: alertPulse 1s infinite;
        }
        
        @keyframes alertPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .print-btn {
            background: #4b5563;
            transition: all 0.2s;
        }
        
        .print-btn:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="min-h-screen">
    
    <!-- Notification Toast -->
    <div id="notification" class="notification">
        <i class="fas fa-bell mr-2"></i>
        <span id="notification-message">Cusbo dheerow!</span>
    </div>

    <!-- Header -->
    <header class="kitchen-header p-6 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 class="text-3xl font-black text-white flex items-center gap-3">
                    <i class="fas fa-utensils text-orange-400"></i>
                    TUFAAX KITCHEN
                </h1>
                <span id="live-indicator" class="bg-green-500 text-xs px-3 py-1 rounded-full font-bold flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    LIVE
                </span>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-orange-500/20 px-4 py-2 rounded-full">
                    <span id="order-count" class="font-bold text-xl text-orange-400">0</span>
                    <span class="text-gray-300 text-sm ml-2">Cunto dalab ah</span>
                </div>
                <button onclick="printKitchenSummary()" class="print-btn text-white px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
                    <i class="fas fa-print"></i>
                    <span>Daabac</span>
                </button>
                <button onclick="clearCompleted()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-xl text-sm transition-all">
                    <i class="fas fa-trash-alt mr-2"></i>Tirtir kuwa la dhammeeyey
                </button>
            </div>
        </div>
    </header>

    <!-- Quick Stats Bar -->
    <div class="max-w-7xl mx-auto px-6 py-4 grid grid-cols-4 gap-4">
        <div class="bg-yellow-600/20 rounded-xl p-3 border border-yellow-600/30">
            <p class="text-xs text-yellow-400">La sugayo</p>
            <p id="pending-count-header" class="text-2xl font-black text-yellow-400">0</p>
        </div>
        <div class="bg-blue-600/20 rounded-xl p-3 border border-blue-600/30">
            <p class="text-xs text-blue-400">Laga shaqaynayo</p>
            <p id="preparing-count-header" class="text-2xl font-black text-blue-400">0</p>
        </div>
        <div class="bg-green-600/20 rounded-xl p-3 border border-green-600/30">
            <p class="text-xs text-green-400">Diyaar u ah</p>
            <p id="ready-count-header" class="text-2xl font-black text-green-400">0</p>
        </div>
        <div class="bg-purple-600/20 rounded-xl p-3 border border-purple-600/30">
            <p class="text-xs text-purple-400">Maanta</p>
            <p id="today-count-header" class="text-2xl font-black text-purple-400">0</p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-6">
        
        <!-- Order Board -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Pending Column -->
            <div class="bg-gray-800/50 rounded-2xl p-4 border border-gray-700">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-yellow-400 flex items-center gap-2">
                        <i class="fas fa-clock"></i>
                        La sugayo
                    </h2>
                    <span id="pending-count" class="bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-full text-sm font-bold">0</span>
                </div>
                <div id="pending-orders" class="space-y-4 min-h-[500px] overflow-y-auto pr-2 max-h-[600px]">
                    <!-- Orders will be inserted here -->
                </div>
            </div>
            
            <!-- Preparing Column -->
            <div class="bg-gray-800/50 rounded-2xl p-4 border border-gray-700">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                        <i class="fas fa-fire"></i>
                        Laga shaqaynayo
                    </h2>
                    <span id="preparing-count" class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-sm font-bold">0</span>
                </div>
                <div id="preparing-orders" class="space-y-4 min-h-[500px] overflow-y-auto pr-2 max-h-[600px]">
                    <!-- Orders will be inserted here -->
                </div>
            </div>
            
            <!-- Ready Column -->
            <div class="bg-gray-800/50 rounded-2xl p-4 border border-gray-700">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-green-400 flex items-center gap-2">
                        <i class="fas fa-check-circle"></i>
                        Diyaar u ah
                    </h2>
                    <span id="ready-count" class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-sm font-bold">0</span>
                </div>
                <div id="ready-orders" class="space-y-4 min-h-[500px] overflow-y-auto pr-2 max-h-[600px]">
                    <!-- Orders will be inserted here -->
                </div>
            </div>
            
        </div>

        <!-- Completed Section (Collapsible) -->
        <div class="mt-8 bg-gray-800/30 rounded-2xl p-4 border border-gray-700">
            <div class="flex items-center justify-between mb-4 cursor-pointer" onclick="toggleCompleted()">
                <h2 class="text-xl font-bold text-gray-400 flex items-center gap-2">
                    <i class="fas fa-history"></i>
                    Dhammeeyey
                </h2>
                <div class="flex items-center gap-4">
                    <span id="completed-count" class="bg-gray-600 text-gray-300 px-3 py-1 rounded-full text-sm font-bold">0</span>
                    <i id="toggle-icon" class="fas fa-chevron-down text-gray-400"></i>
                </div>
            </div>
            <div id="completed-orders" class="hidden space-y-4 max-h-[400px] overflow-y-auto">
                <!-- Completed orders will be inserted here -->
            </div>
        </div>
        
    </main>

    <script>
        // Configuration
        const STORAGE_KEY = 'tufaax_kitchen_orders';
        let orders = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let completedVisible = false;
        let lastOrderCount = orders.length;
        let audioEnabled = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderOrders();
            checkForNewOrders();
            setInterval(checkForNewOrders, 1000); // Check every second
            updateHeaderStats();
            
            // Enable audio after user interaction
            document.addEventListener('click', () => {
                audioEnabled = true;
            }, { once: true });
        });

        // Check for new orders from customer cart
        function checkForNewOrders() {
            const customerCart = JSON.parse(localStorage.getItem('tufaax_cart')) || [];
            
            if (customerCart.length > 0) {
                // Check if this is a new order (not a duplicate)
                const lastOrder = orders[orders.length - 1];
                const cartString = JSON.stringify(customerCart);
                
                if (!lastOrder || lastOrder.itemsString !== cartString) {
                    createOrderFromCart(customerCart);
                }
            }
        }

        // Create new order from customer cart
        function createOrderFromCart(cart) {
            const table = new URLSearchParams(window.location.search).get('table') || 'Lama aqoon';
            
            // Group items by name for better display
            const groupedItems = cart.reduce((acc, item) => {
                const key = item.name;
                if (!acc[key]) {
                    acc[key] = {
                        name: item.name,
                        quantity: 1,
                        price: item.price
                    };
                } else {
                    acc[key].quantity += 1;
                }
                return acc;
            }, {});

            const itemsWithQuantity = Object.values(groupedItems);
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            
            // Generate unique order number
            const orderNumber = Math.floor(Math.random() * 9000) + 1000;
            
            const newOrder = {
                id: 'ORD-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                table: table,
                items: itemsWithQuantity,
                itemsString: JSON.stringify(cart), // For duplicate checking
                total: total,
                status: 'pending',
                timestamp: new Date().toISOString(),
                orderNumber: orderNumber,
                timeReceived: new Date().toLocaleTimeString('so-SO', { hour: '2-digit', minute: '2-digit' })
            };

            orders.push(newOrder);
            saveOrders();
            
            // Play notification sound if enabled
            if (audioEnabled) {
                playNotificationSound();
            }
            
            showNotification('Dalab cusub wuu yimid! #' + orderNumber, 'success');
            
            // Clear customer cart after order is received
            localStorage.removeItem('tufaax_cart');
            
            renderOrders();
            updateHeaderStats();
        }

        // Play notification sound (simple beep)
        function playNotificationSound() {
            try {
                const audio = new Audio('data:audio/wav;base64,UklGRlwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAAAAA8AP8A/gD+AP4A/gD+AP4A/gD+AP4A/gD+AP4A/gD+AP4A/gD+AP4A/gD+AP4A/gD+AP4A/gD+AP4A/gA=');
                audio.play().catch(e => console.log('Audio play failed:', e));
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        // Update order status
        function updateOrderStatus(orderId, newStatus) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                const oldStatus = order.status;
                order.status = newStatus;
                saveOrders();
                
                // Show notification based on status
                if (newStatus === 'preparing') {
                    showNotification(`Dalabka ${order.orderNumber} waa la bilaabay`, 'info');
                } else if (newStatus === 'ready') {
                    showNotification(`Dalabka ${order.orderNumber} waa diyaar!`, 'success');
                } else if (newStatus === 'completed') {
                    showNotification(`Dalabka ${order.orderNumber} waa la dhammeeyey`, 'info');
                }
                
                renderOrders();
                updateHeaderStats();
            }
        }

        // Delete order
        function deleteOrder(orderId) {
            if (confirm('Ma hubtaa inaad tirtirto dalabkan?')) {
                orders = orders.filter(o => o.id !== orderId);
                saveOrders();
                showNotification('Dalabka waa la tirtirey', 'info');
                renderOrders();
                updateHeaderStats();
            }
        }

        // Clear all completed orders
        function clearCompleted() {
            if (confirm('Ma tirtirtaa dhammaan dalabkii la dhammeeyey?')) {
                orders = orders.filter(o => o.status !== 'completed');
                saveOrders();
                showNotification('Kuwa la dhammeeyey waa la tirtirey', 'info');
                renderOrders();
                updateHeaderStats();
            }
        }

        // Save orders to localStorage
        function saveOrders() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
        }

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const messageEl = document.getElementById('notification-message');
            
            // Set color based on type
            if (type === 'success') {
                notification.style.background = '#10b981';
            } else if (type === 'warning') {
                notification.style.background = '#f59e0b';
            } else {
                notification.style.background = '#3b82f6';
            }
            
            messageEl.textContent = message;
            notification.style.display = 'flex';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // Toggle completed section
        function toggleCompleted() {
            completedVisible = !completedVisible;
            const completedDiv = document.getElementById('completed-orders');
            const toggleIcon = document.getElementById('toggle-icon');
            
            if (completedVisible) {
                completedDiv.classList.remove('hidden');
                toggleIcon.className = 'fas fa-chevron-up text-gray-400';
            } else {
                completedDiv.classList.add('hidden');
                toggleIcon.className = 'fas fa-chevron-down text-gray-400';
            }
        }

        // Format time
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('so-SO', { hour: '2-digit', minute: '2-digit' });
        }

        // Update header statistics
        function updateHeaderStats() {
            const pending = orders.filter(o => o.status === 'pending').length;
            const preparing = orders.filter(o => o.status === 'preparing').length;
            const ready = orders.filter(o => o.status === 'ready').length;
            
            // Today's orders
            const today = new Date().toDateString();
            const todayOrders = orders.filter(order => 
                new Date(order.timestamp).toDateString() === today
            ).length;
            
            document.getElementById('pending-count-header').textContent = pending;
            document.getElementById('preparing-count-header').textContent = preparing;
            document.getElementById('ready-count-header').textContent = ready;
            document.getElementById('today-count-header').textContent = todayOrders;
        }

        // Print kitchen summary
        function printKitchenSummary() {
            const printWindow = window.open('', '_blank');
            const pendingOrders = orders.filter(o => o.status === 'pending');
            const preparingOrders = orders.filter(o => o.status === 'preparing');
            const readyOrders = orders.filter(o => o.status === 'ready');
            
            printWindow.document.write(`
                <html>
                <head>
                    <title>Tufaax Kitchen - Summary</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; }
                        h1 { color: #dc2626; }
                        .order { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
                        .pending { border-left: 5px solid #f59e0b; }
                        .preparing { border-left: 5px solid #3b82f6; }
                        .ready { border-left: 5px solid #10b981; }
                    </style>
                </head>
                <body>
                    <h1>🍎 Tufaax Kitchen Summary</h1>
                    <p>${new Date().toLocaleString('so-SO')}</p>
                    
                    <h2>La sugayo (${pendingOrders.length})</h2>
                    ${pendingOrders.map(o => `
                        <div class="order pending">
                            <h3>Dalab #${o.orderNumber} - Miiska ${o.table}</h3>
                            <p>Waqtiga: ${o.timeReceived}</p>
                            <ul>
                                ${o.items.map(item => `<li>${item.quantity}x ${item.name}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('')}
                    
                    <h2>Laga shaqaynayo (${preparingOrders.length})</h2>
                    ${preparingOrders.map(o => `
                        <div class="order preparing">
                            <h3>Dalab #${o.orderNumber} - Miiska ${o.table}</h3>
                            <ul>
                                ${o.items.map(item => `<li>${item.quantity}x ${item.name}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('')}
                    
                    <h2>Diyaar u ah (${readyOrders.length})</h2>
                    ${readyOrders.map(o => `
                        <div class="order ready">
                            <h3>Dalab #${o.orderNumber} - Miiska ${o.table}</h3>
                            <ul>
                                ${o.items.map(item => `<li>${item.quantity}x ${item.name}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('')}
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        // Render all orders
        function renderOrders() {
            const pendingOrders = orders.filter(o => o.status === 'pending');
            const preparingOrders = orders.filter(o => o.status === 'preparing');
            const readyOrders = orders.filter(o => o.status === 'ready');
            const completedOrders = orders.filter(o => o.status === 'completed');

            // Update counts
            document.getElementById('pending-count').textContent = pendingOrders.length;
            document.getElementById('preparing-count').textContent = preparingOrders.length;
            document.getElementById('ready-count').textContent = readyOrders.length;
            document.getElementById('completed-count').textContent = completedOrders.length;
            document.getElementById('order-count').textContent = orders.filter(o => o.status !== 'completed').length;

            // Render pending orders
            document.getElementById('pending-orders').innerHTML = pendingOrders.map(order => `
                <div class="order-card status-pending bg-[#2d2d3a] rounded-xl p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="badge badge-pending">CUSUB</span>
                            <span class="text-sm text-gray-400 ml-2">#${order.orderNumber}</span>
                        </div>
                        <span class="text-orange-400 font-bold">${order.timeReceived}</span>
                    </div>
                    
                    <div class="mb-3">
                        <p class="text-sm text-gray-400 mb-1">
                            <i class="fas fa-map-marker-alt mr-1"></i> Miiska: 
                            <span class="text-white font-bold">${order.table}</span>
                        </p>
                    </div>
                    
                    <div class="space-y-2 mb-4">
                        ${order.items.map(item => `
                            <div class="order-item flex justify-between items-center">
                                <span class="font-medium">${item.name}</span>
                                <span class="text-gray-400">x${item.quantity}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="updateOrderStatus('${order.id}', 'preparing')" class="flex-1 bg-blue-500/20 hover:bg-blue-500/30 text-blue-400 py-2 rounded-xl text-sm font-bold transition-all">
                            <i class="fas fa-play mr-1"></i>Bilow
                        </button>
                        <button onclick="deleteOrder('${order.id}')" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 p-2 rounded-xl transition-all">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('') || '<div class="text-center text-gray-500 py-8"><i class="fas fa-check-circle text-4xl mb-2"></i><p>Wax dalab ah ma jiraan</p></div>';

            // Render preparing orders
            document.getElementById('preparing-orders').innerHTML = preparingOrders.map(order => `
                <div class="order-card status-preparing bg-[#2d2d3a] rounded-xl p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="badge badge-preparing">LA SHAQAYNAYO</span>
                            <span class="text-sm text-gray-400 ml-2">#${order.orderNumber}</span>
                        </div>
                        <span class="text-blue-400 font-bold">${order.timeReceived}</span>
                    </div>
                    
                    <div class="mb-3">
                        <p class="text-sm text-gray-400 mb-1">Miiska: <span class="text-white font-bold">${order.table}</span></p>
                    </div>
                    
                    <div class="space-y-2 mb-4">
                        ${order.items.map(item => `
                            <div class="order-item flex justify-between items-center">
                                <span class="font-medium">${item.name}</span>
                                <span class="text-gray-400">x${item.quantity}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="updateOrderStatus('${order.id}', 'ready')" class="flex-1 bg-green-500/20 hover:bg-green-500/30 text-green-400 py-2 rounded-xl text-sm font-bold transition-all">
                            <i class="fas fa-check mr-1"></i>Diyaar
                        </button>
                        <button onclick="updateOrderStatus('${order.id}', 'pending')" class="bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 p-2 rounded-xl transition-all">
                            <i class="fas fa-undo-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('') || '<div class="text-center text-gray-500 py-8"><i class="fas fa-fire text-4xl mb-2"></i><p>Wax la shaqaynayo ma jiraan</p></div>';

            // Render ready orders
            document.getElementById('ready-orders').innerHTML = readyOrders.map(order => `
                <div class="order-card status-ready bg-[#2d2d3a] rounded-xl p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="badge badge-ready">DIY AAR U AH</span>
                            <span class="text-sm text-gray-400 ml-2">#${order.orderNumber}</span>
                        </div>
                        <span class="text-green-400 font-bold">${order.timeReceived}</span>
                    </div>
                    
                    <div class="mb-3">
                        <p class="text-sm text-gray-400 mb-1">Miiska: <span class="text-white font-bold">${order.table}</span></p>
                    </div>
                    
                    <div class="space-y-2 mb-4">
                        ${order.items.map(item => `
                            <div class="order-item flex justify-between items-center">
                                <span class="font-medium">${item.name}</span>
                                <span class="text-gray-400">x${item.quantity}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="updateOrderStatus('${order.id}', 'completed')" class="flex-1 bg-gray-500/20 hover:bg-gray-500/30 text-gray-300 py-2 rounded-xl text-sm font-bold transition-all">
                            <i class="fas fa-check-double mr-1"></i>Dhammeey
                        </button>
                        <button onclick="updateOrderStatus('${order.id}', 'preparing')" class="bg-blue-500/20 hover:bg-blue-500/30 text-blue-400 p-2 rounded-xl transition-all">
                            <i class="fas fa-undo-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('') || '<div class="text-center text-gray-500 py-8"><i class="fas fa-utensils text-4xl mb-2"></i><p>Wax diyaar ah ma jiraan</p></div>';

            // Render completed orders
            document.getElementById('completed-orders').innerHTML = completedOrders.map(order => `
                <div class="order-card status-completed bg-[#2d2d3a] rounded-xl p-4 opacity-75">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="badge badge-completed">DHAMMEYEY</span>
                            <span class="text-sm text-gray-500 ml-2">#${order.orderNumber}</span>
                        </div>
                        <span class="text-gray-500 font-bold">${order.timeReceived}</span>
                    </div>
                    
                    <div class="mb-3">
                        <p class="text-sm text-gray-500 mb-1">Miiska: <span class="text-gray-400">${order.table}</span></p>
                    </div>
                    
                    <div class="space-y-2 mb-2">
                        ${order.items.map(item => `
                            <div class="order-item bg-[#4d4d5a] flex justify-between items-center opacity-75">
                                <span class="font-medium text-gray-300">${item.name}</span>
                                <span class="text-gray-400">x${item.quantity}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('') || '<div class="text-center text-gray-600 py-4"><p>Wax la dhammeeyey ma jiraan</p></div>';
            
            updateHeaderStats();
        }

        // Expose functions globally
        window.updateOrderStatus = updateOrderStatus;
        window.deleteOrder = deleteOrder;
        window.clearCompleted = clearCompleted;
        window.toggleCompleted = toggleCompleted;
        window.printKitchenSummary = printKitchenSummary;
    </script>
</body>
</html>
