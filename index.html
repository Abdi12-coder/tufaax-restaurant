<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 pb-32">
    <header class="bg-red-600 text-white p-6 rounded-b-[2.5rem] sticky top-0 z-50 shadow-lg">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <h1 class="text-3xl font-black italic">🍎 TUFAAX</h1>
            <div class="relative bg-white p-3 rounded-full text-red-600 shadow-lg">
                <i class="fas fa-shopping-basket text-xl"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-yellow-400 text-black font-bold px-2 py-0.5 rounded-full text-[10px]">0</span>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-4xl mx-auto space-y-6">
        <div class="relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" oninput="updateUI()" placeholder="Raadi cuntada..." class="w-full p-4 pl-12 bg-white rounded-2xl border-none shadow-sm outline-none focus:ring-2 focus:ring-red-400">
        </div>

        <div id="category-list" class="flex space-x-3 overflow-x-auto pb-2">
            <button onclick="filterCategory('Dhammaan', this)" class="category-btn active bg-red-600 text-white px-6 py-2 rounded-full font-bold border whitespace-nowrap">Dhammaan</button>
            <button onclick="filterCategory('Quraac', this)" class="category-btn bg-white px-6 py-2 rounded-full font-bold border whitespace-nowrap">Quraac</button>
            <button onclick="filterCategory('Qado', this)" class="category-btn bg-white px-6 py-2 rounded-full font-bold border whitespace-nowrap">Qado</button>
            <button onclick="filterCategory('Casho', this)" class="category-btn bg-white px-6 py-2 rounded-full font-bold border whitespace-nowrap">Casho</button>
        </div>

        <div id="loading-state" class="text-center py-20 text-gray-400">
            <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
            <p>Menu-ga waa la soo rarayaa...</p>
        </div>
        <div id="menu-items" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzNmboqYQCwz0KU6nJIMGTuPzb7JWQDicacSVKItIVhkUEHqO5nQmy5yfwBDke1ckHv/exec";
        let menuData = [];
        let cart = [];
        let currentCat = 'Dhammaan';

        async function loadMenu(isSilent = false) {
            if (!isSilent) document.getElementById('loading-state').style.display = 'block';
            try {
                const res = await fetch(GOOGLE_URL);
                const data = await res.json();
                
                menuData = data.filter(item => item && (item.id || item.ID)).map(item => {
                    let clean = {};
                    for (let key in item) clean[key.toLowerCase()] = item[key];
                    return clean;
                }).filter(i => i.status !== 'hidden');

                document.getElementById('loading-state').style.display = 'none';
                updateUI();
            } catch (e) { console.log("Refresh error"); }
        }

        function updateUI() {
            const container = document.getElementById('menu-items');
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = menuData;

            if (currentCat !== 'Dhammaan') filtered = filtered.filter(i => i.category === currentCat);
            if (search) filtered = filtered.filter(i => i.name.toLowerCase().includes(search));

            container.innerHTML = filtered.map(item => {
                const count = cart.filter(c => c.id === item.id).length;
                return `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border p-3 flex flex-col transition-all active:scale-95">
                    <img src="${item.img}" class="w-full h-32 object-cover rounded-2xl mb-3" onerror="this.src='https://via.placeholder.com/150'">
                    <h3 class="font-bold text-gray-800 text-sm truncate">${item.name}</h3>
                    <div class="mt-auto flex justify-between items-center pt-2">
                        <span class="text-red-600 font-bold">$${parseFloat(item.price || 0).toFixed(2)}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="changeCart('${item.id}', -1)" class="w-7 h-7 bg-gray-100 rounded-lg font-bold">-</button>
                            <span class="text-xs font-black">${count}</span>
                            <button onclick="changeCart('${item.id}', 1)" class="w-7 h-7 bg-red-600 text-white rounded-lg font-bold">+</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cart-count').innerText = cart.length;
        }

        function changeCart(id, amt) {
            if (amt === 1) {
                const item = menuData.find(m => m.id == id);
                if (item) cart.push({ ...item });
            } else {
                const idx = cart.findLastIndex(c => c.id == id);
                if (idx > -1) cart.splice(idx, 1);
            }
            updateUI();
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.replace('bg-red-600', 'bg-white');
                b.classList.replace('text-white', 'text-black');
            });
            btn.classList.replace('bg-white', 'bg-red-600');
            btn.classList.add('text-white');
            currentCat = cat;
            updateUI();
        }

        loadMenu();
        setInterval(() => loadMenu(true), 15000); // Is-cusboonaysiin aamusan 15-kii ilbiriqsiba
    </script>
</body>
</html>
