<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax Restaurant - Smart Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .cart-badge { position: absolute; top: -5px; right: -5px; font-size: 10px; }
        .sticky-header { position: sticky; top: 0; z-index: 50; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .category-btn.active { background-color: #dc2626; color: white; border-color: #dc2626; }
    </style>
</head>
<body class="bg-gray-50 font-sans pb-32">

    <header class="bg-red-600 text-white p-6 rounded-b-[2.5rem] shadow-2xl sticky-header">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div>
                <h1 class="text-3xl font-black italic">🍎 TUFAAX</h1>
                <p id="table-display" class="text-xs opacity-90 font-bold bg-red-700 px-3 py-1 rounded-full mt-2 inline-block">
                    <i class="fas fa-chair mr-1"></i> Dalabka: Guri
                </p>
            </div>
            <div class="relative bg-white p-3 rounded-full text-red-600 shadow-lg cursor-pointer transition active:scale-90" onclick="document.getElementById('checkout-bar').scrollIntoView({behavior: 'smooth'})">
                <i class="fas fa-shopping-basket text-xl"></i>
                <span id="cart-count" class="cart-badge bg-yellow-400 text-black font-bold px-2 py-0.5 rounded-full shadow-sm">0</span>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-4xl mx-auto space-y-6">
        
        <div class="relative">
            <input type="text" id="search-input" onkeyup="filterMenu()" placeholder="Raadi cuntada aad rabto..." 
                   class="w-full p-4 pl-12 rounded-2xl border-none shadow-md focus:ring-2 focus:ring-red-500 outline-none">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>

        <div class="flex space-x-3 overflow-x-auto pb-2 no-scrollbar">
            <button onclick="filterCategory('Dhammaan', this)" class="category-btn active px-6 py-2 rounded-full font-bold shadow-sm bg-white text-gray-600 border border-gray-100 whitespace-nowrap transition">Dhammaan</button>
            <button onclick="filterCategory('Quraac', this)" class="category-btn px-6 py-2 rounded-full font-bold shadow-sm bg-white text-gray-600 border border-gray-100 whitespace-nowrap transition">Quraac</button>
            <button onclick="filterCategory('Qado', this)" class="category-btn px-6 py-2 rounded-full font-bold shadow-sm bg-white text-gray-600 border border-gray-100 whitespace-nowrap transition">Qado</button>
            <button onclick="filterCategory('Casho', this)" class="category-btn px-6 py-2 rounded-full font-bold shadow-sm bg-white text-gray-600 border border-gray-100 whitespace-nowrap transition">Casho</button>
            <button onclick="filterCategory('Cabitaan', this)" class="category-btn px-6 py-2 rounded-full font-bold shadow-sm bg-white text-gray-600 border border-gray-100 whitespace-nowrap transition">Cabitaan</button>
            <button onclick="filterCategory('Macmacaan', this)" class="category-btn px-6 py-2 rounded-full font-bold shadow-sm bg-white text-gray-600 border border-gray-100 whitespace-nowrap transition">Macmacaan</button>
        </div>

        <div id="menu-items" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4">
            </div>
    </main>

    <div id="checkout-bar" class="fixed bottom-0 left-0 right-0 p-5 bg-white border-t shadow-[0_-10px_25px_rgba(0,0,0,0.1)] hidden z-50 rounded-t-3xl">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-gray-400 text-xs font-bold uppercase">Warta Dalabka</p>
                <p id="total-price" class="text-2xl font-black text-red-600">$0.00</p>
            </div>
            <button onclick="checkoutWhatsApp()" class="bg-green-500 text-white px-8 py-4 rounded-2xl font-black shadow-lg hover:bg-green-600 active:scale-95 transition flex items-center gap-2">
                <i class="fab fa-whatsapp text-xl"></i> DALBO HADDA
            </button>
        </div>
    </div>

    <script>
        const menuData = [
            // QURAAC
            { id: 13, name: "Canjeero iyo Malab", price: 3.00, category: "Quraac", desc: "Canjeero jilicsan oo lagu daray malab dabiici ah.", img: "https://images.unsplash.com/photo-1590103512342-999335805973?w=400" },
            { id: 14, name: "Rooti iyo Ukun", price: 4.00, category: "Quraac", desc: "Rooti kulul, ukun la shiilay ama la kariyey.", img: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400" },
            { id: 15, name: "Sambuuse (3 xabo)", price: 3.00, category: "Quraac", desc: "Sambuuse hilib ama khudaar ka buuxo.", img: "https://images.unsplash.com/photo-1601050633722-343277543e54?w=400" },
            { id: 16, name: "Malawax", price: 3.00, category: "Quraac", desc: "Malawax macaan, malab ama sokor lagu daray.", img: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=400" },

            // QADO
            { id: 1, name: "Bariis iyo Hilib Ari", price: 8.00, category: "Qado", desc: "Bariis basmati, hilib ari cusub, muus iyo salad.", img: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=400" },
            { id: 2, name: "Bariis iyo Hilib Lo’", price: 7.00, category: "Qado", desc: "Bariis xawaash Somali ah, hilib lo’ jilicsan, muus iyo salad.", img: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400" },
            { id: 3, name: "Bariis iyo Digaag", price: 7.00, category: "Qado", desc: "Bariis caraf leh, digaag maraq ama shiilan, muus iyo salad.", img: "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=400" },
            { id: 9, name: "Kalluun Shiilan", price: 8.00, category: "Qado", desc: "Kalluun cusub oo shiilan, bariis ama chips, liin iyo salad.", img: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=400" },
            { id: 5, name: "Cambuulo iyo Hilib", price: 6.00, category: "Qado", desc: "Digir cambuulo la kariyey, hilib lo’ ama ari, subag iyo basbaas.", img: "https://images.unsplash.com/photo-1512058560366-1a51042f55e7?w=400" },

            // CASHO
            { id: 6, name: "Hilib Ari Shiilan", price: 9.00, category: "Casho", desc: "Hilib ari cusub oo la shiilay, rooti ama bariis, basbaas.", img: "https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=400" },
            { id: 8, name: "Digaag Shiilan", price: 7.00, category: "Casho", desc: "Digaag si buuxda loo dubay, chips ama bariis, suugo.", img: "https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=400" },
            { id: 10, name: "Maraq Hilib", price: 5.00, category: "Casho", desc: "Maraq ari ama lo’ oo kulul, rooti ama bariis la socda.", img: "https://images.unsplash.com/photo-1547592110-823d63303867?w=400" },

            // CABITAAN
            { id: 17, name: "Shaah Somali", price: 1.50, category: "Cabitaan", desc: "Shaah caano leh oo dhaqameed.", img: "https://images.unsplash.com/photo-1594631252845-29fc4586d517?w=400" },
            { id: 19, name: "Caano Geel", price: 2.00, category: "Cabitaan", desc: "Caano geel cusub oo nadiif ah.", img: "https://images.unsplash.com/photo-1528750955925-cd325b9a1eb4?w=400" },
            { id: 21, name: "Cabitaanno Qabow", price: 1.00, category: "Cabitaan", desc: "Biyo, Coca-Cola, Fanta, Sprite.", img: "https://images.unsplash.com/photo-1544145945-f904253d0c7b?w=400" },

            // MACMACAAN
            { id: 22, name: "Timir", price: 2.00, category: "Macmacaan", desc: "Timir tayo sare leh.", img: "https://images.unsplash.com/photo-1569470451072-68314f596acc?w=400" },
            { id: 23, name: "Muus", price: 1.00, category: "Macmacaan", desc: "Muus bisil oo cusub.", img: "https://images.unsplash.com/photo-1550258114-b0d240c6fe3e?w=400" }
        ];

        let cart = [];

        function renderMenu(items) {
            const container = document.getElementById('menu-items');
            container.innerHTML = items.map(item => {
                const count = cart.filter(c => c.name === item.name).length;
                return `
                <div class="bg-white rounded-3xl p-3 shadow-sm flex items-center border border-gray-100 transition hover:shadow-md animate-in fade-in">
                    <img src="${item.img}" class="w-24 h-24 rounded-2xl object-cover shadow-sm bg-gray-100">
                    <div class="ml-4 flex-1">
                        <h3 class="font-bold text-gray-800 text-sm">${item.name}</h3>
                        <p class="text-gray-400 text-[10px] leading-tight my-1">${item.desc}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-red-600 font-black text-lg">$${item.price.toFixed(2)}</span>
                            <div class="flex items-center gap-2">
                                ${count > 0 ? `
                                    <button onclick="removeFromCart('${item.name}')" class="bg-gray-100 text-gray-600 w-8 h-8 rounded-full flex items-center justify-center active:scale-90 transition">
                                        <i class="fas fa-minus text-xs"></i>
                                    </button>
                                    <span class="font-bold text-gray-800">${count}</span>
                                ` : ''}
                                <button onclick="addToCart('${item.name}', ${item.price})" class="bg-red-600 text-white w-8 h-8 rounded-full shadow-md flex items-center justify-center active:scale-90 transition">
                                    <i class="fas fa-plus text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateUI();
        }

        function removeFromCart(name) {
            const index = cart.findLastIndex(item => item.name === name);
            if (index > -1) {
                cart.splice(index, 1);
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('total-price').innerText = `$${total.toFixed(2)}`;
            
            const checkoutBar = document.getElementById('checkout-bar');
            cart.length > 0 ? checkoutBar.classList.remove('hidden') : checkoutBar.classList.add('hidden');
            
            // Re-render menu to update counts and minus buttons
            const q = document.getElementById('search-input').value.toLowerCase();
            const currentCat = document.querySelector('.category-btn.active').innerText;
            
            let filtered = menuData;
            if(currentCat !== 'Dhammaan') filtered = menuData.filter(i => i.category === currentCat);
            if(q) filtered = filtered.filter(i => i.name.toLowerCase().includes(q));
            
            renderMenu(filtered);
        }

        function filterMenu() {
            updateUI();
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateUI();
        }

        function checkoutWhatsApp() {
            const phone = "252617054480"; // <--- BADAL LAMBARKAAGA
            let summary = cart.reduce((acc, i) => { acc[i.name] = (acc[i.name] || 0) + 1; return acc; }, {});
            let list = Object.entries(summary).map(([n, q]) => `• ${q}x ${n}`).join('\n');
            let total = cart.reduce((s, i) => s + i.price, 0);
            
            let msg = `*DALAB CUSUB* 🍎\n--------------------------\n${list}\n--------------------------\n💰 *Total:* $${total.toFixed(2)}\n_Fadlan ii diyaariya!_`;
            window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
        }

        renderMenu(menuData);
    </script>
</body>
</html>
