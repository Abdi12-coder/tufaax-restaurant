<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax Restaurant - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .category-btn.active { background-color: #dc2626; color: white; border-color: #dc2626; }
    </style>
</head>
<body class="bg-gray-50 pb-32">

    <header class="bg-red-600 text-white p-6 rounded-b-[2.5rem] sticky top-0 z-50 shadow-lg">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <h1 class="text-3xl font-black italic">🍎 TUFAAX</h1>
            <div class="relative bg-white p-3 rounded-full text-red-600 shadow-lg">
                <i class="fas fa-shopping-basket text-xl"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-yellow-400 text-black font-bold px-2 py-0.5 rounded-full text-[10px]">0</span>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-4xl mx-auto space-y-6">
        <div class="relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" oninput="updateUI()" placeholder="Raadi cuntada aad rabto..." class="w-full p-4 pl-12 bg-white rounded-2xl border-none shadow-sm outline-none focus:ring-2 focus:ring-red-400">
        </div>

        <div class="flex space-x-3 overflow-x-auto pb-2" id="category-list">
            <button onclick="filterCategory('Dhammaan', this)" class="category-btn active px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Dhammaan</button>
            <button onclick="filterCategory('Quraac', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Quraac</button>
            <button onclick="filterCategory('Qado', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Qado</button>
            <button onclick="filterCategory('Casho', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Casho</button>
        </div>

        <div id="loading-state" class="text-center py-20 text-gray-500">
            <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
            <p>Menu-ga waa la cusboonaysiinayaa...</p>
        </div>
        <div id="menu-items" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzTAnR4eeg4k0hnuZgn4u-TuLOCKL43QHvD3BqlND6wg3fFNN9AMJX97FqaiUKNvxk-/exec";
        let menuData = [];
        let cart = [];
        let currentCat = 'Dhammaan';

        async function loadMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                const rawData = await res.json();
                
                // Normalization: Hubi in xogta ay u akhrinto xaraf yar (status, id, etc)
                menuData = rawData.map(item => {
                    let cleanItem = {};
                    for (let key in item) {
                        cleanItem[key.toLowerCase()] = item[key];
                    }
                    return cleanItem;
                }).filter(item => item.id && item.status !== 'hidden');

                document.getElementById('loading-state').style.display = 'none';
                updateUI();
            } catch (e) {
                document.getElementById('loading-state').innerHTML = "Cillad ayaa dhacday. Fadlan dib u tijaabi.";
            }
        }

        function updateUI() {
            const container = document.getElementById('menu-items');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = menuData;
            if (currentCat !== 'Dhammaan') filtered = filtered.filter(i => i.category === currentCat);
            if (searchTerm) filtered = filtered.filter(i => i.name.toLowerCase().includes(searchTerm));

            if (filtered.length === 0) {
                container.innerHTML = "<p class='col-span-full text-center py-10 text-gray-400'>Cunto laguma helin raadintaada.</p>";
                return;
            }

            container.innerHTML = filtered.map(item => {
                const count = cart.filter(c => c.id === item.id).length;
                return `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border p-3 flex flex-col transition-all active:scale-95">
                    <img src="${item.img}" class="w-full h-32 object-cover rounded-2xl mb-3" onerror="this.src='https://via.placeholder.com/150'">
                    <h3 class="font-bold text-gray-800 text-sm truncate">${item.name}</h3>
                    <div class="mt-auto flex justify-between items-center pt-2">
                        <span class="text-red-600 font-bold">$${parseFloat(item.price || 0).toFixed(2)}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="changeCart('${item.id}', -1)" class="w-8 h-8 bg-gray-100 rounded-xl font-bold">-</button>
                            <span class="text-xs font-black">${count}</span>
                            <button onclick="changeCart('${item.id}', 1)" class="w-8 h-8 bg-red-600 text-white rounded-xl font-bold">+</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            document.getElementById('cart-count').innerText = cart.length;
        }

        function changeCart(id, amt) {
            if (amt === 1) {
                const item = menuData.find(m => m.id == id);
                if (item) cart.push({ ...item });
            } else {
                const idx = cart.findLastIndex(c => c.id == id);
                if (idx > -1) cart.splice(idx, 1);
            }
            updateUI();
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCat = cat;
            updateUI();
        }

        // Automatic Refresh: 60-kii ilbiriqsi walba xogta iskeed ha u cusboonaysiiso
        loadMenu();
        setInterval(loadMenu, 60000);
    </script>
</body>
</html>
