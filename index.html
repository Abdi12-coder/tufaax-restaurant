<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax - Secure Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="bg-red-600 text-white p-6 text-center rounded-b-3xl shadow-lg">
        <h1 class="text-3xl font-bold italic text-white">🍎 Tufaax Restaurant</h1>
        <p id="table-display" class="text-sm mt-2 font-bold bg-white text-red-600 inline-block px-3 py-1 rounded-full italic">Xaqiijinta Amniga...</p>
    </div>

    <div class="p-4 max-w-md mx-auto" id="main-content">
        </div>

    <script>
        // 1. Amniga: Hubi Token-ka Link-ga ku jira
        const urlParams = new URLSearchParams(window.location.search);
        const tableNum = urlParams.get('table') || "Guri";
        const token = urlParams.get('t'); // Token-ka waqtiga
        
        // Saacadda hadda jirta (Daqiiqado ahaan)
        const currentTime = Math.floor(Date.now() / (1000 * 60 * 5)); // Isbedela 5-tii daqiiqo kasta
        
        function validateScan() {
            if (token && Math.abs(currentTime - parseInt(token)) <= 1) {
                renderMenu();
                document.getElementById('table-display').innerText = `Miiska: ${tableNum} (Aamin ah)`;
            } else {
                document.body.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-screen p-10 text-center">
                        <h2 class="text-2xl font-bold text-red-600 mb-4 font-sans text-center">❌ Link-gu waa dhacay!</h2>
                        <p class="text-gray-600">Fadlan mar kale scan-garee QR Code-ka rasmiga ah ee miiska saaran. Sawirrada horay loo qaaday ma shaqaynayaan.</p>
                    </div>`;
            }
        }

        function renderMenu() {
            const menuHTML = `
                <div class="space-y-4">
                    <div class="bg-white flex p-4 rounded-2xl shadow-sm items-center justify-between border-l-4 border-green-500">
                        <div>
                            <h3 class="font-bold">Baasto Special</h3>
                            <p class="text-red-600 font-bold">$4.50</p>
                        </div>
                        <button onclick="sendOrder('Baasto Special', '4.50')" class="bg-green-500 text-white px-6 py-2 rounded-xl font-bold shadow-md">Dalbo</button>
                    </div>
                </div>`;
            document.getElementById('main-content').innerHTML = menuHTML;
        }

        function sendOrder(item, price) {
            const myNumber = "252617054480"; // Geli lambarkaaga
            const text = `*DALAB CUSUB (SECURE)* 🍎\n\n📍 *Miiska:* ${tableNum}\n🍴 *Cuntada:* ${item}\n💰 *Qiimaha:* $${price}`;
            window.location.href = `https://wa.me/${myNumber}?text=${encodeURIComponent(text)}`;
        }

        validateScan();
    </script>
</body>
</html>
