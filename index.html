<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax Restaurant - Smart Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .cart-badge { position: absolute; top: -5px; right: -5px; font-size: 10px; }
        .sticky-header { position: sticky; top: 0; z-index: 50; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-32">

    <header class="bg-red-600 text-white p-6 rounded-b-[2.5rem] shadow-2xl sticky-header">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-3xl font-black italic">🍎 TUFAAX</h1>
                <p id="table-display" class="text-sm opacity-90 font-bold bg-red-700 px-3 py-1 rounded-full mt-1 inline-block">
                    <i class="fas fa-chair"></i> Miiska: Guri
                </p>
            </div>
            <div class="relative bg-white p-3 rounded-full text-red-600 shadow-lg cursor-pointer hover:scale-110 transition-transform">
                <i class="fas fa-shopping-basket text-xl"></i>
                <span id="cart-count" class="cart-badge bg-yellow-400 text-black font-bold px-2 py-0.5 rounded-full shadow-sm">0</span>
            </div>
        </div>
    </header>

    <main class="p-5 max-w-md mx-auto space-y-6">
        
        <div class="relative">
            <input type="text" id="search-input" onkeyup="filterMenu()" placeholder="Raadi cuntada..." 
                   class="w-full p-4 pl-12 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-red-500 outline-none">
            <i class="fas fa-search absolute left-4 top-5 text-gray-400"></i>
        </div>

        <div class="flex space-x-3 overflow-x-auto pb-2 no-scrollbar">
            <button onclick="filterCategory('Dhammaan')" class="category-btn bg-red-600 text-white px-6 py-2 rounded-full font-bold shadow-md whitespace-nowrap">Dhammaan</button>
            <button onclick="filterCategory('Qado')" class="category-btn bg-white text-gray-600 px-6 py-2 rounded-full font-bold shadow-sm whitespace-nowrap">Qado</button>
            <button onclick="filterCategory('Cabitaan')" class="category-btn bg-white text-gray-600 px-6 py-2 rounded-full font-bold shadow-sm whitespace-nowrap">Cabitaan</button>
        </div>

        <h2 class="text-xl font-bold text-gray-800" id="category-title">Menu-ga Maanta</h2>

        <div id="menu-items" class="grid gap-4">
            </div>
    </main>

    <div id="checkout-bar" class="fixed bottom-0 left-0 right-0 p-5 bg-white shadow-[0_-10px_20px_rgba(0,0,0,0.05)] hidden rounded-t-3xl">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-gray-500 text-sm font-bold">Warta Dalabka:</p>
                <p id="total-price" class="text-2xl font-black text-red-600">$0.00</p>
            </div>
            <button onclick="checkoutWhatsApp()" class="bg-green-500 text-white px-8 py-4 rounded-2xl font-black shadow-lg hover:bg-green-600 active:scale-95 transition flex items-center gap-2">
                <i class="fab fa-whatsapp text-xl"></i> Dalbo Hadda
            </button>
        </div>
    </div>

    <script>
        // 1. Data: Cuntada Menu-ga ku jirta
        const menuData = [
            { id: 1, name: "Baasto Special", price: 4.50, desc: "Hilib, suugo, iyo khudaar", category: "Qado", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200" },
            { id: 2, name: "Bariis Isku-dhex", price: 5.00, desc: "Bariis iyo hilib geel", category: "Qado", img: "https://images.unsplash.com/photo-1512058560366-1a51042f55e7?w=200" },
            { id: 3, name: "Casiir Qabow", price: 1.50, desc: "Canbe, Liin ama Qare", category: "Cabitaan", img: "https://images.unsplash.com/photo-1544145945-f904253d0c7b?w=200" }
        ];

        let cart = [];
        const urlParams = new URLSearchParams(window.location.search);
        const tableNum = urlParams.get('table') || "Guri";
        document.getElementById('table-display').innerHTML = `<i class="fas fa-chair"></i> Miiska: ${tableNum}`;

        // 2. Function lagu soo bandhigo menu-ga
        function renderMenu(items) {
            const menuContainer = document.getElementById('menu-items');
            menuContainer.innerHTML = items.map(item => `
                <div class="bg-white rounded-3xl p-3 shadow-sm flex items-center border border-gray-50 group transition hover:shadow-md animate-in fade-in duration-500">
                    <img src="${item.img}" class="w-24 h-24 rounded-2xl object-cover shadow-sm">
                    <div class="ml-4 flex-1">
                        <h3 class="font-bold text-lg text-gray-800">${item.name}</h3>
                        <p class="text-gray-400 text-xs mb-2">${item.desc}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-red-600 font-black text-xl">$${item.price.toFixed(2)}</span>
                            <button onclick="addToCart('${item.name}', ${item.price})" class="bg-red-100 text-red-600 p-2 rounded-lg hover:bg-red-600 hover:text-white transition">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 3. Search & Filter Functions
        function filterMenu() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filtered = menuData.filter(item => item.name.toLowerCase().includes(searchTerm));
            renderMenu(filtered);
        }

        function filterCategory(cat) {
            // Update buttons style
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-red-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-600');
            });
            event.target.classList.add('bg-red-600', 'text-white');

            if (cat === 'Dhammaan') {
                renderMenu(menuData);
            } else {
                const filtered = menuData.filter(item => item.category === cat);
                renderMenu(filtered);
            }
        }

        // 4. Cart Logic
        function addToCart(name, price) {
            cart.push({ name, price });
            updateUI();
            
            // Notification yar oo ah in wax lagu daray
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fas fa-check"></i>';
            setTimeout(() => btn.innerHTML = '<i class="fas fa-plus"></i>', 800);
        }

        function updateUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('total-price').innerText = `$${total.toFixed(2)}`;
            
            if (cart.length > 0) {
                document.getElementById('checkout-bar').classList.remove('hidden');
            }
        }

        // 5. WhatsApp Integration
        function checkoutWhatsApp() {
            const myNumber = "252612345678"; // <--- HALKAN LAMBARKAAGA DHIG
            
            let itemSummary = cart.reduce((acc, item) => {
                acc[item.name] = (acc[item.name] || 0) + 1;
                return acc;
            }, {});

            let foodList = "";
            for (const [name, qty] of Object.entries(itemSummary)) {
                foodList += `• ${qty}x ${name}\n`;
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const message = `*DALAB CUSUB* 🍎\n\n` +
                            `📍 *Miiska:* ${tableNum}\n` +
                            `--------------------------\n` +
                            `${foodList}` +
                            `--------------------------\n` +
                            `💰 *Warta:* $${total.toFixed(2)}\n\n` +
                            `_Fadlan si degdeg ah ii diyaariya!_`;

            window.location.href = `https://wa.me/${myNumber}?text=${encodeURIComponent(message)}`;
        }

        // Marka horeba menu-ga soo bandhig
        renderMenu(menuData);
    </script>
</body>
</html>
