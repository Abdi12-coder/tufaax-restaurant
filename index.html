<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax - 10m Secure Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="bg-red-600 text-white p-6 text-center rounded-b-3xl shadow-lg">
        <h1 class="text-3xl font-bold italic">🍎 Tufaax Restaurant</h1>
        <p id="status-label" class="text-sm mt-2 font-bold bg-white text-red-600 inline-block px-3 py-1 rounded-full italic italic">Hubinta masaafada...</p>
    </div>

    <div class="p-4 max-w-md mx-auto space-y-4" id="menu-area" style="display: none;">
        <h2 class="text-lg font-bold text-gray-700 mb-2 border-l-4 border-red-600 pl-2">Qadada Maanta</h2>

        <div class="bg-white flex p-4 rounded-2xl shadow-sm items-center justify-between border border-gray-100">
            <div class="flex items-center">
                <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center text-2xl mr-3">🍝</div>
                <div>
                    <h3 class="font-bold text-gray-800">Baasto Special</h3>
                    <p class="text-red-600 font-black">$4.50</p>
                </div>
            </div>
            <button onclick="sendOrder('Baasto Special', '4.50')" class="bg-green-500 text-white px-5 py-2 rounded-xl font-bold shadow-md active:scale-95 transition">Dalbo</button>
        </div>

        <div class="bg-white flex p-4 rounded-2xl shadow-sm items-center justify-between border border-gray-100">
            <div class="flex items-center">
                <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center text-2xl mr-3">🍚</div>
                <div>
                    <h3 class="font-bold text-gray-800">Bariis Isku-dhex</h3>
                    <p class="text-red-600 font-black">$5.00</p>
                </div>
            </div>
            <button onclick="sendOrder('Bariis Isku-dhex', '5.00')" class="bg-green-500 text-white px-5 py-2 rounded-xl font-bold shadow-md active:scale-95 transition">Dalbo</button>
        </div>
    </div>

    <div id="error-area" class="p-10 text-center flex flex-col items-center justify-center h-screen" style="display: none;">
        <div class="text-6xl mb-4">📍</div>
        <h2 class="text-2xl font-bold text-red-600">Aad ayaad u fogtahay!</h2>
        <p class="text-gray-500 mt-2">Waa inaad u jirtaa maqaayadda wax ka yar 10 mitir si aad u dalbato.</p>
        <button onclick="location.reload()" class="mt-5 bg-red-600 text-white px-6 py-2 rounded-full font-bold">Mar kale isku day</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tableNum = urlParams.get('table') || "Test";

        // 1. Masaafada waxaan ka dhignay 0.01 (taas oo u dhiganta 10 mitir)
        const MAX_DISTANCE = 0.01; 

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function initLocation() {
            navigator.geolocation.getCurrentPosition((position) => {
                let savedLat = localStorage.getItem('test_lat');
                let savedLon = localStorage.getItem('test_lon');

                if (!savedLat) {
                    localStorage.setItem('test_lat', position.coords.latitude);
                    localStorage.setItem('test_lon', position.coords.longitude);
                    savedLat = position.coords.latitude;
                    savedLon = position.coords.longitude;
                }

                const dist = getDistance(position.coords.latitude, position.coords.longitude, parseFloat(savedLat), parseFloat(savedLon));

                // Haddii dist ka yar yahay 0.01 (10 mitir)
                if (dist <= MAX_DISTANCE) {
                    document.getElementById('menu-area').style.display = 'block';
                    document.getElementById('status-label').innerText = `Miiska: ${tableNum} (Aamin ah)`;
                } else {
                    document.getElementById('error-area').style.display = 'flex';
                }
            }, () => {
                alert("Fadlan ogolow GPS-ka.");
            });
        }

        function sendOrder(item, price) {
            const myNumber = "252617054480"; // Geli lambarkaaga
            const text = `*DALAB VERIFIED (10M)* ✅\n\n📍 *Miiska:* ${tableNum}\n🍴 *Cuntada:* ${item}\n💰 *Qiimaha:* $${price}`;
            window.location.href = `https://wa.me/${myNumber}?text=${encodeURIComponent(text)}`;
        }

        initLocation();
    </script>
</body>
</html>
