<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax - 10m Secure Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="bg-red-600 text-white p-6 text-center rounded-b-3xl shadow-lg">
        <h1 class="text-3xl font-bold italic">🍎 Tufaax Restaurant</h1>
        <p id="status-label" class="text-sm mt-2 font-bold bg-white text-red-600 inline-block px-3 py-1 rounded-full italic">Hubinta Goobta (10m)...</p>
    </div>

    <div class="p-4 max-w-md mx-auto space-y-4" id="menu-area" style="display: none;">
        <h2 class="text-lg font-bold text-gray-700 mb-2 border-l-4 border-red-600 pl-2">Qadada Maanta</h2>

        <div class="bg-white flex p-4 rounded-2xl shadow-sm items-center justify-between border border-gray-100">
            <div class="flex items-center">
                <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center text-2xl mr-3">🍝</div>
                <div>
                    <h3 class="font-bold text-gray-800">Baasto Special</h3>
                    <p class="text-red-600 font-black">$4.50</p>
                </div>
            </div>
            <button onclick="sendOrder('Baasto Special', '4.50')" class="bg-green-500 text-white px-5 py-2 rounded-xl font-bold shadow-md active:scale-95 transition text-sm">Dalbo</button>
        </div>

        <div class="bg-white flex p-4 rounded-2xl shadow-sm items-center justify-between border border-gray-100">
            <div class="flex items-center">
                <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center text-2xl mr-3">🍚</div>
                <div>
                    <h3 class="font-bold text-gray-800">Bariis Isku-dhex</h3>
                    <p class="text-red-600 font-black">$5.00</p>
                </div>
            </div>
            <button onclick="sendOrder('Bariis Isku-dhex', '5.00')" class="bg-green-500 text-white px-5 py-2 rounded-xl font-bold shadow-md active:scale-95 transition text-sm">Dalbo</button>
        </div>
    </div>

    <div id="error-area" class="p-10 text-center flex flex-col items-center justify-center h-[60vh]" style="display: none;">
        <div class="text-6xl mb-4">📍</div>
        <h2 class="text-2xl font-bold text-red-600">Waad ka fogaatay!</h2>
        <p class="text-gray-500 mt-2 text-sm">Nidaamku wuxuu ogaaday inaad ka baxday masaafadii 10m ahayd.</p>
        
        <button onclick="resetLocation()" class="mt-6 bg-red-600 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-red-700 transition">
            🔄 Cusboonaysii Goobta
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tableNum = urlParams.get('table') || "Test";
        const MAX_DISTANCE = 0.01; // 10 Mitir

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function initLocation() {
            navigator.geolocation.getCurrentPosition((position) => {
                let savedLat = localStorage.getItem('test_lat');
                let savedLon = localStorage.getItem('test_lon');

                // Haddii ay tahay markii ugu horeysay, keydi meesha uu hadda joogo
                if (!savedLat) {
                    localStorage.setItem('test_lat', position.coords.latitude);
                    localStorage.setItem('test_lon', position.coords.longitude);
                    savedLat = position.coords.latitude;
                    savedLon = position.coords.longitude;
                }

                const dist = getDistance(position.coords.latitude, position.coords.longitude, parseFloat(savedLat), parseFloat(savedLon));

                // Haddii uu 10m u jiro
                if (dist <= MAX_DISTANCE) {
                    document.getElementById('menu-area').style.display = 'block';
                    document.getElementById('error-area').style.display = 'none';
                    document.getElementById('status-label').innerText = `Miiska: ${tableNum} (Goobtu waa Sax)`;
                } else {
                    document.getElementById('menu-area').style.display = 'none';
                    document.getElementById('error-area').style.display = 'flex';
                    document.getElementById('status-label').innerText = "Maqaayadda ka baxsan";
                }
            }, (err) => {
                alert("Fadlan ogolow Location-ka Browser-kaaga.");
            }, { enableHighAccuracy: true });
        }

        // Shaqada badhanka Refresh
        function resetLocation() {
            localStorage.removeItem('test_lat');
            localStorage.removeItem('test_lon');
            location.reload();
        }

        function sendOrder(item, price) {
            const myNumber = "252617054480"; // <--- GELI LAMBARKAAGA
            const text = `*DALAB VERIFIED (10M)* 🍎\n\n📍 *Miiska:* ${tableNum}\n🍴 *Cuntada:* ${item}\n💰 *Qiimaha:* $${price}`;
            window.location.href = `https://wa.me/${myNumber}?text=${encodeURIComponent(text)}`;
        }

        initLocation();
    </script>
</body>
</html>
