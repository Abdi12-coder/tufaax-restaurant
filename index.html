<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax Restaurant - WhatsApp Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-red-600 text-white p-10 rounded-b-[3rem] shadow-xl text-center">
        <h1 class="text-4xl font-black italic text-white">🍎 TUFAAX</h1>
        <div id="table-display" class="mt-3 bg-white text-red-600 inline-block px-6 py-1 rounded-full font-bold shadow-sm">
            Aqoonsanaya Miiska...
        </div>
    </header>

    <main class="p-6 max-w-md mx-auto space-y-6">
        <h2 class="text-xl font-bold border-l-4 border-red-600 pl-3">Qadada Maanta</h2>

        <div class="bg-white rounded-3xl p-4 shadow-sm flex items-center border border-gray-100">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150" class="w-20 h-20 rounded-2xl object-cover shadow">
            <div class="ml-4 flex-1">
                <h3 class="font-bold text-lg text-gray-800">Baasto Special</h3>
                <p class="text-red-600 font-black text-xl">$4.50</p>
                <button onclick="sendWhatsApp('Baasto Special', '4.50')" class="mt-2 w-full bg-green-500 text-white py-2 rounded-xl font-bold hover:bg-green-600 active:scale-95 transition">Dalbo WhatsApp</button>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-4 shadow-sm flex items-center border border-gray-100">
            <img src="https://images.unsplash.com/photo-1512058560366-1a51042f55e7?w=150" class="w-20 h-20 rounded-2xl object-cover shadow">
            <div class="ml-4 flex-1">
                <h3 class="font-bold text-lg text-gray-800">Bariis Isku-dhex</h3>
                <p class="text-red-600 font-black text-xl">$5.00</p>
                <button onclick="sendWhatsApp('Bariis Isku-dhex', '5.00')" class="mt-2 w-full bg-green-500 text-white py-2 rounded-xl font-bold hover:bg-green-600 active:scale-95 transition">Dalbo WhatsApp</button>
            </div>
        </div>
    </main>

    <script>
        // 1. Helitaanka Miiska si automatic ah
        const urlParams = new URLSearchParams(window.location.search);
        const tableNum = urlParams.get('table') || "Guri";
        document.getElementById('table-display').innerText = `Miiska: ${tableNum}`;

        function sendWhatsApp(food, price) {
            // GELI LAMBARKAAGA HALKAN (Tusaale: 25261XXXXXXX)
            const myNumber = "252612345678"; 
            
            // Farriinta loo dirayo WhatsApp
            const message = `*DALAB CUSUB* 🍎\n\n📍 *Miiska:* ${tableNum}\n🍴 *Cuntada:* ${food}\n💰 *Qiimaha:* $${price}\n\n_Fadlan ii diyaariya!_`;
            
            // Habka loogu beddelayo URL ahaan
            const encodedMessage = encodeURIComponent(message);
            
            // U wareejinta WhatsApp
            window.location.href = `https://wa.me/${myNumber}?text=${encodedMessage}`;
        }
    </script>
</body>
</html>
