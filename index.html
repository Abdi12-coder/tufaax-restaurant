<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax - Fast Live Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="bg-red-600 text-white p-6 text-center rounded-b-3xl shadow-lg sticky top-0 z-50">
        <h1 class="text-3xl font-bold italic">🍎 Tufaax Restaurant</h1>
        <div id="indicator" class="mt-2 inline-flex items-center bg-white px-3 py-1 rounded-full">
            <span id="dot" class="w-3 h-3 bg-gray-400 rounded-full mr-2"></span>
            <span id="status-label" class="text-xs font-bold text-gray-700">Hubinta...</span>
        </div>
    </div>

    <div id="menu-area" class="p-4 max-w-md mx-auto space-y-4" style="display: none;">
        <h2 class="text-lg font-bold text-gray-700 border-l-4 border-red-600 pl-2 mb-4">Qadada Maanta</h2>
        
        <div class="bg-white flex p-4 rounded-2xl shadow-sm items-center justify-between border-l-4 border-green-500 animate-in fade-in duration-500">
            <div class="flex items-center">
                <div class="text-2xl mr-3">🍝</div>
                <div>
                    <h3 class="font-bold text-gray-800">Baasto Special</h3>
                    <p class="text-red-600 font-black">$4.50</p>
                </div>
            </div>
            <button onclick="sendOrder('Baasto Special', '4.50')" class="bg-green-500 text-white px-5 py-2 rounded-xl font-bold">Dalbo</button>
        </div>
    </div>

    <div id="error-area" class="p-10 text-center flex flex-col items-center justify-center h-[60vh]">
        <div class="text-6xl mb-4 opacity-50">📍</div>
        <h2 class="text-xl font-bold text-red-600 uppercase tracking-wider">Lama Aqoonsan</h2>
        <p class="text-gray-500 mt-2 text-sm italic">Fadlan u dhowaada miiska si uu menu-gu u furmo...</p>
    </div>

    <script>
        const MAX_DISTANCE = 0.01; // 10 Mitir
        let watchID = null;

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function startFastTracking() {
            const options = {
                enableHighAccuracy: true, // Isticmaal awoodda ugu sarreysa
                timeout: 5000,           // Sug 5 ilbiriqsi si aad u hesho signal
                maximumAge: 0            // Ha isticmaalin xog hore, mar walba mid cusub raba
            };

            watchID = navigator.geolocation.watchPosition((position) => {
                let savedLat = localStorage.getItem('test_lat');
                let savedLon = localStorage.getItem('test_lon');

                if (!savedLat) {
                    localStorage.setItem('test_lat', position.coords.latitude);
                    localStorage.setItem('test_lon', position.coords.longitude);
                    savedLat = position.coords.latitude;
                    savedLon = position.coords.longitude;
                }

                const dist = getDistance(position.coords.latitude, position.coords.longitude, parseFloat(savedLat), parseFloat(savedLon));

                const menuArea = document.getElementById('menu-area');
                const errorArea = document.getElementById('error-area');
                const statusLabel = document.getElementById('status-label');
                const dot = document.getElementById('dot');

                if (dist <= MAX_DISTANCE) {
                    if(menuArea.style.display === 'none') {
                        menuArea.style.display = 'block';
                        errorArea.style.display = 'none';
                        statusLabel.innerText = "Miiska: Test (Verified)";
                        dot.className = "w-3 h-3 bg-green-500 rounded-full mr-2 shadow-[0_0_8px_green]";
                    }
                } else {
                    if(errorArea.style.display === 'none') {
                        menuArea.style.display = 'none';
                        errorArea.style.display = 'flex';
                        statusLabel.innerText = "Aad baad u fogtahay";
                        dot.className = "w-3 h-3 bg-red-600 rounded-full mr-2";
                    }
                }
            }, (err) => {
                console.warn("GPS Signal daciif ah...");
            }, options);
        }

        function sendOrder(item, price) {
            const myNumber = "252617054480";
            window.location.href = `https://wa.me/${myNumber}?text=${encodeURIComponent("*DALAB:* " + item)}`;
        }

        startFastTracking();
    </script>
</body>
</html>
