<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍎 Tufaax Restaurant - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f9fafb; }
        
        .cart-badge { position: absolute; top: -8px; right: -8px; font-size: 11px; }
        .category-btn.active { background: #dc2626 !important; color: white; border-color: #dc2626; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* No white fade animations - instant updates */
        #menu-items { transition: none; }
        .item-card { transition: none; }
        
        .live-badge { background: #22c55e; animation: soft-pulse 1.5s infinite; }
        @keyframes soft-pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    </style>
</head>
<body class="pb-32">

    <!-- Header -->
    <header class="bg-gradient-to-r from-red-600 to-red-700 text-white p-6 rounded-b-[3rem] sticky top-0 z-50 shadow-2xl">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter flex items-center gap-2">
                    🍎 TUFAAX
                    <span id="live-indicator" class="live-badge text-xs text-green-900 px-2 py-1 rounded-full font-bold">LIVE</span>
                </h1>
                <p id="display-table" class="text-xs font-bold bg-black/20 px-3 py-1 rounded-full mt-2 hidden w-fit backdrop-blur-sm">
                    📍 Miiska: 1
                </p>
            </div>
            <button onclick="toggleCart()" class="relative bg-white p-3 rounded-2xl text-red-600 shadow-lg active:scale-90 transition-all">
                <i class="fas fa-shopping-basket text-xl"></i>
                <span id="cart-count" class="cart-badge bg-yellow-400 text-black font-black px-2.5 py-1 rounded-full border-2 border-white shadow-lg">0</span>
            </button>
        </div>
    </header>

    <main class="p-4 max-w-4xl mx-auto space-y-6">
        
        <!-- Search Bar -->
        <div class="bg-white p-3 rounded-2xl shadow-md border border-gray-200 flex items-center px-5 transition-all focus-within:ring-2 focus-within:ring-red-300">
            <i class="fas fa-search text-gray-400 mr-3 text-lg"></i>
            <input type="text" id="custSearch" oninput="updateUI()" placeholder="Raadi cuntada aad rabto..." class="w-full outline-none bg-transparent text-sm">
            <button onclick="clearSearch()" id="clear-search" class="hidden text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
        </div>

        <!-- Category Filter -->
        <div class="flex space-x-3 overflow-x-auto pb-3 no-scrollbar">
            <button onclick="filterCategory('Dhammaan', this)" class="category-btn active px-6 py-2.5 rounded-full font-bold bg-white border-2 border-gray-200 whitespace-nowrap shadow-sm text-sm">
                <i class="fas fa-th mr-1"></i> Dhammaan
            </button>
            <button onclick="filterCategory('Quraac', this)" class="category-btn px-6 py-2.5 rounded-full font-bold bg-white border-2 border-gray-200 whitespace-nowrap text-sm">
                <i class="fas fa-egg mr-1"></i> Quraac
            </button>
            <button onclick="filterCategory('Qado', this)" class="category-btn px-6 py-2.5 rounded-full font-bold bg-white border-2 border-gray-200 whitespace-nowrap text-sm">
                <i class="fas fa-utensils mr-1"></i> Qado
            </button>
            <button onclick="filterCategory('Casho', this)" class="category-btn px-6 py-2.5 rounded-full font-bold bg-white border-2 border-gray-200 whitespace-nowrap text-sm">
                <i class="fas fa-drumstick-bite mr-1"></i> Casho
            </button>
            <button onclick="filterCategory('Coffee', this)" class="category-btn px-6 py-2.5 rounded-full font-bold bg-white border-2 border-gray-200 whitespace-nowrap text-sm">
                <i class="fas fa-coffee mr-1"></i> Coffee
            </button>
            <button onclick="filterCategory('Shaah', this)" class="category-btn px-6 py-2.5 rounded-full font-bold bg-white border-2 border-gray-200 whitespace-nowrap text-sm">
                <i class="fas fa-mug-hot mr-1"></i> Shaah
            </button>
            <button onclick="filterCategory('Cabitaan', this)" class="category-btn px-6 py-2.5 rounded-full font-bold bg-white border-2 border-gray-200 whitespace-nowrap text-sm">
                <i class="fas fa-glass-water mr-1"></i> Cabitaan
            </button>
            <button onclick="filterCategory('Macmacaan', this)" class="category-btn px-6 py-2.5 rounded-full font-bold bg-white border-2 border-gray-200 whitespace-nowrap text-sm">
                <i class="fas fa-ice-cream mr-1"></i> Macmacaan
            </button>
        </div>

        <!-- Menu Items Grid -->
        <div id="menu-items" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Loading Skeletons (simple gray boxes) -->
            <div class="bg-gray-200 rounded-[2rem] h-64 animate-pulse"></div>
            <div class="bg-gray-200 rounded-[2rem] h-64 animate-pulse"></div>
            <div class="bg-gray-200 rounded-[2rem] h-64 animate-pulse"></div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
            <i class="fas fa-search text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-600 mb-2">Lama Helin</h3>
            <p class="text-gray-400 text-sm">Fadlan isku day eray kale ama dooro qayb kale</p>
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div id="checkout-bar" class="fixed bottom-0 left-0 right-0 p-5 bg-white/95 backdrop-blur-sm border-t-2 border-gray-200 shadow-2xl hidden z-50 rounded-t-[2.5rem]">
        <div class="max-w-4xl mx-auto">
            <div id="cart-summary" class="mb-4 max-h-32 overflow-y-auto no-scrollbar space-y-2"></div>
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-gray-400 text-xs font-black uppercase tracking-wider">Wadarta Guud</p>
                    <p id="total-price" class="text-3xl font-black text-red-600">$0.00</p>
                    <p id="item-count-text" class="text-gray-400 text-xs mt-1">0 shay</p>
                </div>
                <button onclick="checkoutWhatsApp()" class="bg-gradient-to-r from-green-500 to-green-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg active:scale-95 transition-all flex items-center gap-3">
                    <i class="fab fa-whatsapp text-2xl"></i> 
                    <span>DALBO<br><span class="text-xs font-normal">via WhatsApp</span></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzVMUruRAnuRcUqfV0CqgiSK1yDSDJo_UTYIE7mNabudjfIMl_H1ZHl58ymhmu97pTzcw/exec"; // Replace with your Apps Script URL
        const WHATSAPP_PHONE = "252617054480";
        const REFRESH_INTERVAL = 500; // 0.5 seconds

        // State
        let menuData = JSON.parse(localStorage.getItem('tufaax_cache')) || [];
        let cart = JSON.parse(localStorage.getItem('tufaax_cart')) || [];
        let currentCategory = 'Dhammaan';
        let isLoading = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tableId = urlParams.get('table') || '';
            if (tableId) {
                document.getElementById('display-table').innerHTML = `📍 Miiska: <span class="font-black">${tableId}</span>`;
                document.getElementById('display-table').classList.remove('hidden');
            }
            
            if (menuData.length > 0) updateUI();
            loadMenu();
            setInterval(loadMenu, REFRESH_INTERVAL);
        });

        // Load Menu from Google Sheets
        async function loadMenu() {
            if (isLoading) return;
            try {
                isLoading = true;
                const res = await fetch(GOOGLE_URL);
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                // Only show visible items to customers
                const visibleItems = data.filter(item => item.status !== 'hidden');
                
                if (JSON.stringify(visibleItems) !== JSON.stringify(menuData)) {
                    menuData = visibleItems;
                    localStorage.setItem('tufaax_cache', JSON.stringify(menuData));
                    updateUI();
                }
            } catch (error) {
                console.error('Menu load error:', error);
            } finally {
                isLoading = false;
            }
        }

        // Update UI with filtered items
        function updateUI() {
            const container = document.getElementById('menu-items');
            const searchTerm = document.getElementById('custSearch').value.toLowerCase();
            const searchBtn = document.getElementById('clear-search');
            searchBtn.classList.toggle('hidden', !searchTerm);

            // Filter by category
            let filtered = currentCategory === 'Dhammaan' ? menuData : menuData.filter(i => i.category === currentCategory);
            
            // Filter by search
            if (searchTerm) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(searchTerm) ||
                    (item.description && item.description.toLowerCase().includes(searchTerm))
                );
            }

            // Empty state
            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-state').classList.add('hidden');
            }

            // Render items
            container.innerHTML = filtered.map((item, index) => {
                const count = cart.filter(c => String(c.id) === String(item.id)).length;
                return `
                <div class="item-card bg-white rounded-[2rem] overflow-hidden shadow-md hover:shadow-xl border border-gray-100 p-4 flex flex-col">
                    <div class="relative mb-3">
                        <img src="${item.img}" class="w-full h-40 object-cover rounded-[1.5rem] bg-gray-200" onerror="this.src='https://via.placeholder.com/300/dc2626/ffffff?text=Tufaax'">
                        ${count > 0 ? `<div class="absolute top-2 right-2 bg-red-600 text-white text-xs font-black px-2 py-1 rounded-full shadow-lg">${count}x</div>` : ''}
                    </div>
                    
                    <h3 class="font-black text-gray-800 text-sm mb-1 px-1 uppercase tracking-tight">${item.name}</h3>
                    
                    <p class="text-xs text-gray-500 line-clamp-2 px-1 mb-3 h-10 italic">${item.description || 'Cunto fiican oo dhadhan macaan leh'}</p>

                    <div class="mt-auto flex justify-between items-center pt-2 border-t border-gray-100">
                        <div>
                            <span class="text-red-600 font-black text-xl">${formatPrice(item.price)}</span>
                            <span class="text-xs text-gray-400 block mt-0.5">${item.category}</span>
                        </div>
                        
                        <div class="flex items-center gap-2 bg-gray-50 p-1.5 rounded-xl shadow-inner">
                            <button onclick="removeFromCart('${item.id}')" class="w-9 h-9 bg-white border-2 border-gray-200 rounded-lg font-black active:scale-90 transition-all ${count === 0 ? 'opacity-30 cursor-not-allowed' : ''}" ${count === 0 ? 'disabled' : ''}>
                                <i class="fas fa-minus text-xs text-gray-600"></i>
                            </button>
                            
                            <span class="text-sm font-black w-6 text-center ${count > 0 ? 'text-red-600' : 'text-gray-400'}">${count}</span>
                            
                            <button onclick="addToCart('${item.id}')" class="w-9 h-9 bg-gradient-to-br from-red-600 to-red-700 text-white rounded-lg font-black active:scale-90 transition-all shadow-md">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            updateCartDisplay();
        }

        // Cart Functions
        function addToCart(id) {
            const item = menuData.find(m => String(m.id) === String(id));
            if (item) {
                cart.push({ id: item.id, name: item.name, price: parseFloat(item.price) });
                updateUI();
            }
        }

        function removeFromCart(id) {
            const idx = cart.findLastIndex(c => String(c.id) === String(id));
            if (idx > -1) {
                cart.splice(idx, 1);
                updateUI();
            }
        }

        function updateCartDisplay() {
            document.getElementById('cart-count').innerText = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('total-price').innerText = formatPrice(total);
            
            const uniqueItems = [...new Set(cart.map(i => i.id))].length;
            document.getElementById('item-count-text').innerText = `${cart.length} shay (${uniqueItems} nooc)`;
            
            document.getElementById('checkout-bar').classList.toggle('hidden', cart.length === 0);
            
            // Cart summary
            if (cart.length > 0) {
                const grouped = cart.reduce((acc, item) => {
                    acc[item.name] = (acc[item.name] || 0) + 1;
                    return acc;
                }, {});
                
                document.getElementById('cart-summary').innerHTML = Object.entries(grouped)
                    .map(([name, qty]) => `
                        <div class="flex justify-between items-center text-xs bg-gray-50 rounded-lg px-3 py-2">
                            <span class="font-bold text-gray-700">${qty}x ${name}</span>
                        </div>
                    `).join('');
            }
            
            localStorage.setItem('tufaax_cart', JSON.stringify(cart));
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('custSearch').value = '';
            updateUI();
        }

        function clearSearch() {
            document.getElementById('custSearch').value = '';
            updateUI();
        }

        function toggleCart() {
            document.getElementById('checkout-bar').scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) {
                alert('Fadlan soo dar cunto ka hor intaanad dalbanin!');
                return;
            }
            
            const tableId = new URLSearchParams(window.location.search).get('table') || 'Lama aqoon';
            
            let msg = "🍎 *DALAB CUSUB - TUFAAX*%0A%0A";
            msg += `📍 *Miiska:* ${tableId}%0A`;
            msg += "─────────────────────%0A%0A";
            
            const grouped = cart.reduce((acc, item) => {
                if (!acc[item.name]) acc[item.name] = { qty: 0, price: item.price };
                acc[item.name].qty += 1;
                return acc;
            }, {});

            for (const [name, data] of Object.entries(grouped)) {
                const itemTotal = data.qty * data.price;
                msg += `✅ ${data.qty}x *${name}*%0A`;
                msg += `   ${formatPrice(data.price)} × ${data.qty} = ${formatPrice(itemTotal)}%0A%0A`;
            }

            const total = cart.reduce((sum, i) => sum + i.price, 0);
            msg += "─────────────────────%0A";
            msg += `💰 *WADARTA GUUD:* ${formatPrice(total)}%0A%0A`;
            msg += "🙏 Mahadsanid!";
            
            window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${msg}`, '_blank');
        }

        function formatPrice(price) {
            return `$${parseFloat(price || 0).toFixed(2)}`;
        }

        // Expose functions globally
        window.updateUI = updateUI;
        window.filterCategory = filterCategory;
        window.clearSearch = clearSearch;
        window.toggleCart = toggleCart;
        window.checkoutWhatsApp = checkoutWhatsApp;
        window.addToCart = addToCart;
        window.removeFromCart = removeFromCart;
    </script>
</body>
</html>
