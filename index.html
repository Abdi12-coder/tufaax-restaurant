<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax Restaurant - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <header class="bg-red-600 text-white p-10 rounded-b-[3rem] shadow-xl text-center">
        <h1 class="text-4xl font-black italic">🍎 TUFAAX</h1>
        <div id="table-status" class="mt-3 bg-white text-red-600 inline-block px-6 py-1 rounded-full font-bold shadow-sm">
            Aqoonsanaya Miiska...
        </div>
    </header>

    <main class="p-6 max-w-md mx-auto space-y-6">
        <h2 class="text-xl font-bold border-l-4 border-red-600 pl-3">Qadada Maanta</h2>

        <div class="bg-white rounded-3xl p-4 shadow-sm flex items-center border border-gray-100">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150" class="w-20 h-20 rounded-2xl object-cover shadow">
            <div class="ml-4 flex-1">
                <h3 class="font-bold text-lg">Baasto Special</h3>
                <p class="text-red-600 font-black text-xl">$4.50</p>
                <button onclick="submitOrder('Baasto Special')" class="mt-2 w-full bg-green-500 text-white py-2 rounded-xl font-bold hover:bg-green-600 active:scale-95 transition">Dalbo</button>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-4 shadow-sm flex items-center border border-gray-100">
            <img src="https://images.unsplash.com/photo-1512058560366-1a51042f55e7?w=150" class="w-20 h-20 rounded-2xl object-cover shadow">
            <div class="ml-4 flex-1">
                <h3 class="font-bold text-lg">Bariis Isku-dhex</h3>
                <p class="text-red-600 font-black text-xl">$5.00</p>
                <button onclick="submitOrder('Bariis Isku-dhex')" class="mt-2 w-full bg-green-500 text-white py-2 rounded-xl font-bold hover:bg-green-600 active:scale-95 transition">Dalbo</button>
            </div>
        </div>
    </main>

    <div id="msg" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-6 text-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-2xl">
            <div class="text-5xl mb-4">✅</div>
            <h2 class="text-2xl font-bold mb-2">Dalabkaaga waa la diray!</h2>
            <p class="text-gray-500 mb-6">Jikada ayaa hadda guda gashay diyaarinta cuntadaada.</p>
            <button onclick="document.getElementById('msg').style.display='none'" class="bg-red-600 text-white px-8 py-2 rounded-full font-bold">Ok</button>
        </div>
    </div>

    <script>
        // 1. Helitaanka Miiska link-ga ka yimid
        const urlParams = new URLSearchParams(window.location.search);
        const tableNum = urlParams.get('table') || "Guri";
        document.getElementById('table-status').innerText = `Miiska: ${tableNum}`;

        async function submitOrder(food) {
            const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSflaFJMc7A9v4ZAbyJmEXL96UU9ngzEwsNgqKnRvVR6avbv8A/formResponse";
            
            const formData = new FormData();
            formData.append("entry.926164446", food);      // Dalabka ID-gaaga
            formData.append("entry.1864224881", tableNum);  // Miiska ID-gaaga

            try {
                await fetch(formURL, { method: "POST", mode: "no-cors", body: formData });
                document.getElementById('msg').style.display = 'flex';
            } catch (e) {
                alert("Khalad ayaa dhacay, fadlan mar kale isku day.");
            }
        }
    </script>
</body>
</html>
