<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🍎 Tufaax Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            padding: 1rem;
            padding-bottom: 100px;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            padding: 1.5rem;
            border-radius: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.2);
        }
        
        /* Cart badge */
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #fbbf24;
            color: black;
            font-weight: 900;
            min-width: 24px;
            height: 24px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid white;
        }
        
        /* Category buttons */
        .category-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-weight: bold;
            background: white;
            border: 2px solid #e2e8f0;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .category-btn.active {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
        }
        
        /* Item cards */
        .item-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        
        .item-card.hidden-item {
            opacity: 0.7;
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        
        .hidden-badge {
            background: #64748b;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 999px;
            position: absolute;
            top: 8px;
            right: 8px;
        }
        
        /* Menu grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        @media (min-width: 640px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (min-width: 1024px) {
            .menu-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        /* Cart bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 1rem;
            border-top: 2px solid #e2e8f0;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            transform: translateY(100%);
            transition: transform 0.3s;
            z-index: 40;
        }
        
        .cart-bar.visible {
            transform: translateY(0);
        }
        
        /* Quantity buttons */
        .qty-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            background: white;
        }
        
        .qty-btn.primary {
            background: #dc2626;
            color: white;
            border: none;
        }
        
        .qty-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        
        /* Show Hidden Button - NEW */
        .show-hidden-btn {
            background: #64748b;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .show-hidden-btn.active {
            background: #f59e0b;
        }
        
        /* Success modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
        }
        
        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="text-center">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check-circle text-4xl text-green-600"></i>
                </div>
                <h3 class="text-2xl font-black mb-2">Order Sent!</h3>
                <p class="text-gray-500 mb-4">Your order has been sent to the kitchen</p>
                <div class="bg-orange-50 rounded-xl p-4 mb-4">
                    <p class="text-sm text-gray-600">Table</p>
                    <p id="modal-table" class="text-3xl font-black text-orange-600">#1</p>
                </div>
                <button onclick="closeModal()" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold">
                    OK
                </button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black">🍎 TUFAAX</h1>
                <p id="display-table" class="text-sm bg-white/20 px-3 py-1 rounded-full mt-2 hidden">
                    Table <span></span>
                </p>
            </div>
            <button onclick="toggleCart()" class="relative bg-white p-3 rounded-xl">
                <i class="fas fa-shopping-basket text-red-600 text-xl"></i>
                <span id="cart-count" class="cart-badge">0</span>
            </button>
        </div>
    </div>

    <!-- Search and Filter Row -->
    <div class="flex flex-col sm:flex-row gap-3 mb-4">
        <!-- Search -->
        <div class="flex-1 bg-white rounded-full px-4 py-2 flex items-center border">
            <i class="fas fa-search text-gray-400 mr-2"></i>
            <input type="text" id="custSearch" oninput="updateUI()" placeholder="Search food..." class="w-full outline-none">
        </div>
        
        <!-- SHOW HIDDEN BUTTON - NEW -->
        <button id="showHiddenBtn" onclick="toggleHidden()" class="show-hidden-btn">
            <i class="fas fa-eye-slash"></i>
            <span>Show Hidden</span>
        </button>
    </div>

    <!-- Categories -->
    <div class="overflow-x-auto mb-4 pb-2">
        <div class="flex gap-2">
            <button onclick="filterCategory('Dhammaan', this)" class="category-btn active">All</button>
            <button onclick="filterCategory('Quraac', this)" class="category-btn">Breakfast</button>
            <button onclick="filterCategory('Qado', this)" class="category-btn">Lunch</button>
            <button onclick="filterCategory('Casho', this)" class="category-btn">Dinner</button>
            <button onclick="filterCategory('Coffee', this)" class="category-btn">Coffee</button>
            <button onclick="filterCategory('Shaah', this)" class="category-btn">Tea</button>
            <button onclick="filterCategory('Cabitaan', this)" class="category-btn">Drinks</button>
        </div>
    </div>

    <!-- Menu Grid -->
    <div id="menu-items" class="menu-grid">
        <!-- Loading -->
        <div class="bg-gray-200 h-48 rounded-2xl animate-pulse"></div>
        <div class="bg-gray-200 h-48 rounded-2xl animate-pulse"></div>
        <div class="bg-gray-200 h-48 rounded-2xl animate-pulse"></div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-12">
        <i class="fas fa-search text-5xl text-gray-300 mb-3"></i>
        <p class="text-gray-500">No items found</p>
    </div>

    <!-- Cart Bar -->
    <div id="checkout-bar" class="cart-bar">
        <div class="max-w-4xl mx-auto">
            <div id="cart-summary" class="mb-3"></div>
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-xs text-gray-500">Total</p>
                    <p id="total-price" class="text-2xl font-black text-red-600">$0.00</p>
                </div>
                <button onclick="sendOrder()" class="bg-green-600 text-white px-8 py-3 rounded-xl font-bold text-lg">
                    <i class="fas fa-paper-plane mr-2"></i>Order
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwyQGcd5Sp-jg1vzseWKacgsm13rglK5t0gdt7DfO1gd_x9NMpRsBlYvxQgzlaxdgom2Q/exec";
        let menuData = JSON.parse(localStorage.getItem('tufaax_cache')) || [];
        let cart = JSON.parse(localStorage.getItem('tufaax_cart')) || [];
        let currentCategory = 'Dhammaan';
        let showHidden = false; // NEW: toggle for hidden items

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const table = new URLSearchParams(window.location.search).get('table');
            if (table) {
                document.getElementById('display-table').querySelector('span').textContent = table;
                document.getElementById('display-table').classList.remove('hidden');
            }
            
            if (menuData.length > 0) updateUI();
            loadMenu();
            setInterval(loadMenu, 1000);
        });

        // Load menu
        async function loadMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                const data = await res.json();
                if (JSON.stringify(data) !== JSON.stringify(menuData)) {
                    menuData = data;
                    localStorage.setItem('tufaax_cache', JSON.stringify(menuData));
                    updateUI();
                }
            } catch (e) {
                console.log('Load error');
            }
        }

        // Toggle hidden items - NEW FUNCTION
        function toggleHidden() {
            showHidden = !showHidden;
            const btn = document.getElementById('showHiddenBtn');
            if (showHidden) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-eye"></i><span>Show All</span>';
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fas fa-eye-slash"></i><span>Show Hidden</span>';
            }
            updateUI();
        }

        // Update UI
        function updateUI() {
            const container = document.getElementById('menu-items');
            const searchTerm = document.getElementById('custSearch').value.toLowerCase();

            // Filter by category
            let filtered = currentCategory === 'Dhammaan' ? menuData : menuData.filter(i => i.category === currentCategory);
            
            // Filter by hidden/show
            if (!showHidden) {
                filtered = filtered.filter(i => i.status !== 'hidden');
            }
            
            // Filter by search
            if (searchTerm) {
                filtered = filtered.filter(i => i.name.toLowerCase().includes(searchTerm));
            }

            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');

            container.innerHTML = filtered.map(item => {
                const count = cart.filter(c => String(c.id) === String(item.id)).length;
                const isHidden = item.status === 'hidden';
                
                return `
                <div class="item-card ${isHidden ? 'hidden-item' : ''}">
                    <div class="relative">
                        <img src="${item.img}" class="w-full h-32 object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200'">
                        ${isHidden ? '<span class="hidden-badge"><i class="fas fa-eye-slash mr-1"></i>Hidden</span>' : ''}
                        ${count > 0 ? `<span class="absolute top-2 left-2 bg-red-600 text-white text-xs px-2 py-1 rounded-full">${count}</span>` : ''}
                    </div>
                    <div class="mt-2">
                        <h3 class="font-bold">${item.name}</h3>
                        <p class="text-xs text-gray-400 mb-2">${item.description || ''}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-red-600 font-black">$${parseFloat(item.price).toFixed(2)}</span>
                            <div class="flex items-center gap-1">
                                <button onclick="removeFromCart('${item.id}')" class="qty-btn" ${count === 0 ? 'disabled' : ''}>
                                    <i class="fas fa-minus"></i>
                                </button>
                                <span class="font-bold w-6 text-center">${count}</span>
                                <button onclick="addToCart('${item.id}')" class="qty-btn primary">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            updateCart();
        }

        // Cart functions
        function addToCart(id) {
            const item = menuData.find(m => String(m.id) === String(id));
            if (item) {
                cart.push({ id: item.id, name: item.name, price: parseFloat(item.price) });
                updateUI();
            }
        }

        function removeFromCart(id) {
            const idx = cart.findLastIndex(c => String(c.id) === String(id));
            if (idx > -1) {
                cart.splice(idx, 1);
                updateUI();
            }
        }

        function updateCart() {
            document.getElementById('cart-count').textContent = cart.length;
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('total-price').textContent = `$${total.toFixed(2)}`;
            
            if (cart.length > 0) {
                document.getElementById('checkout-bar').classList.add('visible');
                
                // Group items for summary
                const grouped = {};
                cart.forEach(i => grouped[i.name] = (grouped[i.name] || 0) + 1);
                
                document.getElementById('cart-summary').innerHTML = Object.entries(grouped)
                    .map(([name, qty]) => `
                        <div class="flex justify-between text-sm bg-gray-50 p-2 rounded">
                            <span>${qty}x ${name}</span>
                        </div>
                    `).join('');
            } else {
                document.getElementById('checkout-bar').classList.remove('visible');
            }
            
            localStorage.setItem('tufaax_cart', JSON.stringify(cart));
        }

        // Send order to kitchen
        function sendOrder() {
            if (cart.length === 0) return;
            
            const table = new URLSearchParams(window.location.search).get('table') || '1';
            
            // Group items
            const grouped = {};
            cart.forEach(i => grouped[i.name] = (grouped[i.name] || 0) + 1);
            
            const items = Object.entries(grouped).map(([name, qty]) => ({ name, quantity: qty }));
            
            const order = {
                id: 'ORD-' + Date.now(),
                table: table,
                items: items,
                itemsString: JSON.stringify(cart),
                timestamp: new Date().toISOString(),
                timeReceived: new Date().toLocaleTimeString()
            };
            
            // Save to kitchen
            const kitchenOrders = JSON.parse(localStorage.getItem('tufaax_kitchen_orders')) || [];
            kitchenOrders.unshift(order);
            localStorage.setItem('tufaax_kitchen_orders', JSON.stringify(kitchenOrders));
            
            // Show modal
            document.getElementById('modal-table').textContent = `Table ${table}`;
            document.getElementById('successModal').style.display = 'flex';
            
            // Clear cart
            cart = [];
            updateUI();
            
            setTimeout(closeModal, 3000);
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateUI();
        }

        function toggleCart() {
            document.getElementById('checkout-bar').scrollIntoView({ behavior: 'smooth' });
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }

        // Expose functions
        window.updateUI = updateUI;
        window.filterCategory = filterCategory;
        window.toggleCart = toggleCart;
        window.sendOrder = sendOrder;
        window.addToCart = addToCart;
        window.removeFromCart = removeFromCart;
        window.closeModal = closeModal;
        window.toggleHidden = toggleHidden;
    </script>
</body>
</html>
