<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-cat { background-color: #dc2626; color: white; border-color: #dc2626; }
    </style>
</head>
<body class="bg-gray-50 pb-32">

    <header class="bg-red-600 text-white p-6 rounded-b-[3rem] sticky top-0 z-50 shadow-xl">
        <div class="flex justify-between items-center max-w-4xl mx-auto mb-4">
            <div>
                <h1 class="text-3xl font-black italic">🍎 TUFAAX</h1>
                <p id="table-display" class="text-[10px] font-bold bg-white/20 px-3 py-1 rounded-full mt-1 inline-block border border-white/30">MIISKA: ...</p>
            </div>
            <div class="relative bg-white p-3 rounded-2xl text-red-600 shadow-lg cursor-pointer active:scale-90 transition">
                <i class="fas fa-shopping-basket text-xl"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-yellow-400 text-black text-[10px] font-black px-2 py-0.5 rounded-full border-2 border-white">0</span>
            </div>
        </div>
        <div class="max-w-4xl mx-auto relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-red-300"></i>
            <input type="text" id="userSearch" oninput="updateUI()" placeholder="Raadi cunto..." class="w-full bg-red-700/50 border border-red-400 rounded-2xl py-3 pl-12 pr-4 text-white outline-none placeholder-red-300">
        </div>
    </header>

    <main class="p-4 max-w-4xl mx-auto space-y-6">
        <div class="flex space-x-3 overflow-x-auto pb-2 no-scrollbar">
            <button onclick="filterCategory('Dhammaan', this)" class="category-btn active-cat px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap shadow-sm">Dhammaan</button>
            <button onclick="filterCategory('Quraac', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap shadow-sm">Quraac</button>
            <button onclick="filterCategory('Qado', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap shadow-sm">Qado</button>
            <button onclick="filterCategory('Casho', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap shadow-sm">Casho</button>
            <button onclick="filterCategory('Cabitaan', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap shadow-sm">Cabitaan</button>
        </div>

        <div id="menu-items" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <div id="checkout-bar" class="fixed bottom-0 left-0 right-0 p-5 bg-white/90 backdrop-blur-md border-t shadow-2xl hidden z-50 rounded-t-[2.5rem]">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-gray-400 text-[10px] font-black uppercase">Total Price</p>
                <p id="total-price" class="text-2xl font-black text-red-600">$0.00</p>
            </div>
            <button onclick="checkoutWhatsApp()" class="bg-green-500 text-white px-10 py-4 rounded-2xl font-black shadow-lg active:scale-95 transition">
                <i class="fab fa-whatsapp mr-2"></i> DALBO HADDA
            </button>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzN7tYUEMrPtYhRXZwt0z5--8vUKL1Gl35Ixa8WWzesIbReJUa2f9aZWjZF7Gu3iQYH/exec";
        let menuData = [];
        let cart = [];

        // Automatic Table Detection
        const urlParams = new URLSearchParams(window.location.search);
        const tableId = urlParams.get('table') || "LA'AAN";
        document.getElementById('table-display').innerText = `MIISKA: ${tableId}`;

        async function loadMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                const data = await res.json();
                const filtered = data.filter(item => item.status !== 'hidden');
                if(JSON.stringify(filtered) !== JSON.stringify(menuData)) {
                    menuData = filtered;
                    updateUI();
                }
            } catch (e) { }
        }

        function updateUI() {
            const container = document.getElementById('menu-items');
            const search = document.getElementById('userSearch').value.toLowerCase();
            const activeBtn = document.querySelector('.active-cat').innerText;
            
            let filtered = menuData.filter(i => i.name.toLowerCase().includes(search));
            if(activeBtn !== 'Dhammaan') filtered = filtered.filter(i => i.category === activeBtn);

            container.innerHTML = filtered.map(item => {
                const count = cart.filter(c => String(c.id) === String(item.id)).length;
                const isSoldOut = item.status === 'soldout';
                return `
                <div class="bg-white rounded-[2rem] overflow-hidden shadow-sm border border-gray-100 p-3 flex flex-col ${isSoldOut ? 'opacity-60' : ''}">
                    <div class="relative">
                        <img src="${item.img}" class="w-full h-36 object-cover rounded-[1.5rem] mb-3 ${isSoldOut ? 'grayscale' : ''}">
                        ${isSoldOut ? '<span class="absolute top-2 left-2 bg-black text-white text-[10px] font-bold px-2 py-1 rounded-full">DHAMMAAD</span>' : ''}
                    </div>
                    <h3 class="font-black text-gray-800 text-sm truncate px-1">${item.name}</h3>
                    <div class="mt-auto flex justify-between items-center pt-3">
                        <span class="text-red-600 font-black text-lg">$${parseFloat(item.price).toFixed(2)}</span>
                        <div class="flex items-center gap-2">
                            ${!isSoldOut ? `
                                <button onclick="removeFromCart('${item.id}')" class="w-8 h-8 bg-gray-50 border rounded-lg font-black">-</button>
                                <span class="text-xs font-black w-4 text-center">${count}</span>
                                <button onclick="addToCart('${item.id}')" class="w-8 h-8 bg-red-600 text-white rounded-lg font-black">+</button>
                            ` : '<span class="text-[10px] text-gray-400 font-bold">OUT</span>'}
                        </div>
                    </div>
                </div>`;
            }).join('');
            updateCartSummary();
        }

        function addToCart(id) {
            const item = menuData.find(m => String(m.id) === String(id));
            if(item) cart.push(item);
            updateUI();
        }

        function removeFromCart(id) {
            const idx = cart.findLastIndex(c => String(c.id) === String(id));
            if(idx > -1) cart.splice(idx, 1);
            updateUI();
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active-cat'));
            btn.classList.add('active-cat');
            updateUI();
        }

        function updateCartSummary() {
            document.getElementById('cart-count').innerText = cart.length;
            const total = cart.reduce((sum, i) => sum + parseFloat(i.price), 0);
            document.getElementById('total-price').innerText = `$${total.toFixed(2)}`;
            document.getElementById('checkout-bar').classList.toggle('hidden', cart.length === 0);
        }

        function checkoutWhatsApp() {
            const phone = "252617054480"; // Nambarkaaga
            let msg = `🛒 *DALAB CUSUB - MIISKA ${tableId}*%0A%0A`;
            
            const grouped = cart.reduce((acc, item) => {
                acc[item.name] = (acc[item.name] || 0) + 1;
                return acc;
            }, {});

            for (const [name, qty] of Object.entries(grouped)) {
                msg += `▪️ ${qty}x ${name}%0A`;
            }

            const total = cart.reduce((sum, i) => sum + parseFloat(i.price), 0);
            msg += `%0A💰 *Wadarta: $${total.toFixed(2)}*`;
            window.open(`https://wa.me/${phone}?text=${msg}`);
        }

        setInterval(loadMenu, 1500);
        loadMenu();
    </script>
</body>
</html>
