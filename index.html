<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax - Digital Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .category-btn.active { background-color: #dc2626; color: white; border-color: #dc2626; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 pb-32">
    <header class="bg-red-600 text-white p-6 rounded-b-[3rem] sticky top-0 z-50 shadow-xl">
        <h1 class="text-3xl font-black italic text-center">🍎 TUFAAX</h1>
    </header>

    <main class="p-4 max-w-4xl mx-auto space-y-6">
        <div class="flex space-x-3 overflow-x-auto pb-2 no-scrollbar">
            <button onclick="filterCategory('Dhammaan', this)" class="category-btn active px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Dhammaan</button>
            <button onclick="filterCategory('Quraac', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Quraac</button>
            <button onclick="filterCategory('Qado', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Qado</button>
            <button onclick="filterCategory('Casho', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Casho</button>
            <button onclick="filterCategory('Coffee', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Coffee</button>
            <button onclick="filterCategory('Shaah', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Shaah</button>
            <button onclick="filterCategory('Cabitaan', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Cabitaan</button>
        </div>

        <div id="menu-items" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwk9qt-H6s3vk9x58YxfXoDtVl_14nnkL4G6ghoohIFu0RB0pBoCI6_ewOGCw473ZXP/exec";
        let menuData = [];

        async function loadMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                const data = await res.json();
                menuData = data.filter(i => i.status !== 'hidden');
                updateUI();
            } catch (e) {}
        }

        function updateUI() {
            const container = document.getElementById('menu-items');
            const cat = document.querySelector('.category-btn.active').innerText;
            
            let filtered = menuData;
            if(cat !== 'Dhammaan') filtered = menuData.filter(i => i.category === cat);

            container.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-[2rem] p-3 shadow-sm border border-gray-100 flex flex-col">
                    <img src="${item.img}" class="w-full h-32 object-cover rounded-[1.5rem] mb-2">
                    <h3 class="font-black text-gray-800 text-xs truncate px-1">${item.name}</h3>
                    
                    <p class="text-[10px] text-gray-400 line-clamp-2 px-1 mb-2 leading-tight h-6">
                        ${item.description || 'Macaan oo nadiif ah'}
                    </p>

                    <div class="mt-auto flex justify-between items-center">
                        <span class="text-red-600 font-black">$${parseFloat(item.price).toFixed(2)}</span>
                        <button class="bg-red-600 text-white w-8 h-8 rounded-lg font-black">+</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); updateUI();
        }

        setInterval(loadMenu, 500); 
        loadMenu();
    </script>
</body>
</html>
