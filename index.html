<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax - Digital Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>.category-btn.active { background-color: #dc2626; color: white; border-color: #dc2626; }</style>
</head>
<body class="bg-gray-50 pb-32">
    <header class="bg-red-600 text-white p-6 rounded-b-[3rem] sticky top-0 z-50 shadow-xl flex justify-between items-center max-w-4xl mx-auto">
        <h1 class="text-3xl font-black italic">🍎 TUFAAX</h1>
        <div class="relative bg-white p-3 rounded-2xl text-red-600 shadow-lg">
            <i class="fas fa-shopping-basket text-xl"></i>
            <span id="cart-count" class="absolute -top-1 -right-1 bg-yellow-400 text-black text-[10px] font-bold px-2 py-0.5 rounded-full border-2 border-white">0</span>
        </div>
    </header>

    <main class="p-4 max-w-4xl mx-auto space-y-6">
        <input type="text" id="custSearch" oninput="updateUI()" placeholder="Raadi halkan..." class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
        
        <div class="flex space-x-3 overflow-x-auto no-scrollbar pb-2">
            <button onclick="filterCategory('Dhammaan', this)" class="category-btn active px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Dhammaan</button>
            <button onclick="filterCategory('Quraac', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Quraac</button>
            <button onclick="filterCategory('Qado', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Qado</button>
            <button onclick="filterCategory('Casho', this)" class="category-btn px-6 py-2 rounded-full font-bold bg-white border whitespace-nowrap">Casho</button>
        </div>

        <div id="menu-items" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <div id="checkout-bar" class="fixed bottom-0 left-0 right-0 p-5 bg-white/90 backdrop-blur-md border-t hidden z-50 rounded-t-[2.5rem] shadow-2xl">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <p id="total-price" class="text-2xl font-black text-red-600">$0.00</p>
            <button onclick="checkoutWhatsApp()" class="bg-green-500 text-white px-10 py-4 rounded-2xl font-black">DALBO HADDA</button>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbxFfrF8ML0UNNw0rPucw-O1bsvUCRek69jD82DmixgYjjR3mMb22g0mj-rTRncylf1f/exec";
        let menuData = JSON.parse(localStorage.getItem('tufaax_cache')) || [];
        let cart = [];
        const tableId = new URLSearchParams(window.location.search).get('table') || "Unknown";

        async function loadMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                const data = await res.json();
                const filtered = data.filter(i => i.status !== 'hidden');
                if(JSON.stringify(filtered) !== JSON.stringify(menuData)) {
                    menuData = filtered;
                    localStorage.setItem('tufaax_cache', JSON.stringify(menuData));
                    updateUI();
                }
            } catch (e) {}
        }

        function updateUI() {
            const container = document.getElementById('menu-items');
            const cat = document.querySelector('.category-btn.active').innerText;
            const search = document.getElementById('custSearch').value.toLowerCase();
            
            let data = menuData;
            if(cat !== 'Dhammaan') data = data.filter(i => i.category === cat);
            data = data.filter(i => i.name.toLowerCase().includes(search));

            container.innerHTML = data.map(item => {
                const qty = cart.filter(c => String(c.id) === String(item.id)).length;
                return `
                <div class="bg-white rounded-[2rem] p-3 shadow-sm border border-gray-100 flex flex-col">
                    <img src="${item.img}" class="w-full h-32 object-cover rounded-[1.5rem] mb-2">
                    <h3 class="font-black text-xs truncate px-1">${item.name}</h3>
                    <p class="text-[9px] text-gray-400 line-clamp-2 px-1 mb-2 h-6 leading-tight">${item.description || 'Macaan & Nadiif'}</p>
                    <div class="mt-auto flex justify-between items-center">
                        <span class="text-red-600 font-black">$${parseFloat(item.price || 0).toFixed(2)}</span>
                        <div class="flex items-center gap-1 bg-gray-50 p-1 rounded-xl">
                            <button onclick="changeQty('${item.id}',-1)" class="w-7 h-7 bg-white border rounded-lg font-black">-</button>
                            <span class="text-[10px] font-black w-4 text-center">${qty}</span>
                            <button onclick="changeQty('${item.id}',1)" class="w-7 h-7 bg-red-600 text-white rounded-lg font-black">+</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            updateSummary();
        }

        function changeQty(id, delta) {
            if(delta > 0) {
                const item = menuData.find(m => String(m.id) === String(id));
                cart.push({ id: item.id, name: item.name, price: parseFloat(item.price) });
            } else {
                const idx = cart.findLastIndex(c => String(c.id) === String(id));
                if(idx > -1) cart.splice(idx, 1);
            }
            updateUI();
        }

        function updateSummary() {
            const total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('total-price').innerText = `$${total.toFixed(2)}`;
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('checkout-bar').classList.toggle('hidden', cart.length === 0);
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); updateUI();
        }

        function checkoutWhatsApp() {
            const phone = "252617054480";
            let msg = `DALAB CUSUB 🍎%0A📍 Miiska: ${tableId}%0A--------------------------%0A`;
            const counts = cart.reduce((a, i) => { a[i.name] = (a[i.name] || 0) + 1; return a; }, {});
            for (const [n, q] of Object.entries(counts)) msg += `* ${q}x ${n}%0A`;
            msg += `--------------------------%0A💰 Total: $${cart.reduce((s,i)=>s+i.price,0).toFixed(2)}`;
            window.open(`https://wa.me/${phone}?text=${msg}`);
        }

        setInterval(loadMenu, 500); // 0.5 sec Auto-Refresh
        updateUI(); loadMenu();
    </script>
</body>
</html>
