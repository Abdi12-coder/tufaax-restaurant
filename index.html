<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🍎 Tufaax Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Responsive base */
        html { font-size: 14px; }
        @media (min-width: 640px) { html { font-size: 16px; } }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
        }
        
        /* Touch-friendly */
        button, .item-card, .category-btn {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Category buttons */
        .category-btn {
            transition: all 0.2s;
            white-space: nowrap;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-weight: bold;
            background: white;
            border: 2px solid #e2e8f0;
        }
        
        .category-btn.active {
            background: #dc2626 !important;
            color: white !important;
            border-color: #dc2626 !important;
        }
        
        /* Item cards */
        .item-card {
            background: white;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.2s;
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }
        
        .item-card:active {
            transform: scale(0.98);
        }
        
        /* Cart badge */
        .cart-badge {
            position: absolute;
            top: -0.5rem;
            right: -0.5rem;
            min-width: 1.5rem;
            height: 1.5rem;
            background: #fbbf24;
            color: black;
            font-weight: 800;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border: 2px solid white;
        }
        
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        /* Responsive grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        @media (min-width: 640px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1.5rem;
            }
        }
        
        @media (min-width: 1024px) {
            .menu-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        /* Cart bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e2e8f0;
            padding: 1rem;
            z-index: 40;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }
        
        .cart-bar.visible {
            transform: translateY(0);
        }
        
        /* Success modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
        }
        
        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* Live indicator */
        .live-badge {
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        /* Quantity buttons */
        .quantity-btn {
            min-width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            font-weight: bold;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .quantity-btn.minus {
            background: white;
            border: 2px solid #e2e8f0;
            color: #4b5563;
        }
        
        .quantity-btn.minus:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .quantity-btn.plus {
            background: #dc2626;
            color: white;
        }
        
        .quantity-btn.plus:hover {
            background: #b91c1c;
        }
        
        /* Header */
        .customer-header {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            border-bottom: 4px solid #fbbf24;
        }
        
        /* Price tag */
        .price-tag {
            font-size: 1.25rem;
            font-weight: 800;
            color: #dc2626;
        }
    </style>
</head>
<body class="pb-32">

    <!-- Success Modal - Shows when order is placed -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="text-center">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check-circle text-4xl text-green-600"></i>
                </div>
                <h3 class="text-2xl font-black text-gray-800 mb-2">Order Sent!</h3>
                <p class="text-gray-500 mb-4">Your order has been sent to the kitchen</p>
                
                <div class="bg-orange-50 rounded-2xl p-4 mb-4">
                    <p class="text-sm text-gray-600 mb-1">Order Number</p>
                    <p id="orderNumberDisplay" class="text-3xl font-black text-orange-600">#123</p>
                </div>
                
                <div class="border-t border-gray-200 pt-4 mb-4">
                    <p class="font-bold text-gray-700 mb-2">Your Items:</p>
                    <div id="orderItemsDisplay" class="space-y-2 text-left"></div>
                </div>
                
                <button onclick="closeModal()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-red-700 transition-all">
                    OK
                </button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="customer-header text-white sticky top-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black flex items-center gap-2">
                        🍎 TUFAAX
                        <span id="live-indicator" class="live-badge text-xs px-2 py-1 rounded-full text-green-900">LIVE</span>
                    </h1>
                    <p id="display-table" class="text-xs bg-black/20 px-3 py-1 rounded-full mt-2 hidden w-fit">
                        📍 Table: <span class="font-black"></span>
                    </p>
                </div>
                <button onclick="toggleCart()" class="relative bg-white p-3 rounded-2xl text-red-600 shadow-lg active:scale-95 transition-all">
                    <i class="fas fa-shopping-basket text-xl"></i>
                    <span id="cart-count" class="cart-badge">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        
        <!-- Search Bar -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex items-center px-4 py-2">
            <i class="fas fa-search text-gray-400 mr-3"></i>
            <input 
                type="text" 
                id="custSearch" 
                oninput="updateUI()" 
                placeholder="Search for food..." 
                class="w-full py-3 outline-none bg-transparent text-sm"
            >
            <button onclick="clearSearch()" id="clear-search" class="hidden text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Categories - Horizontal Scroll (NO ADMIN BUTTONS) -->
        <div class="overflow-x-auto no-scrollbar pb-2">
            <div class="flex space-x-2 min-w-max">
                <button onclick="filterCategory('Dhammaan', this)" class="category-btn active">
                    <i class="fas fa-th mr-1"></i> All
                </button>
                <button onclick="filterCategory('Quraac', this)" class="category-btn">
                    <i class="fas fa-egg mr-1"></i> Breakfast
                </button>
                <button onclick="filterCategory('Qado', this)" class="category-btn">
                    <i class="fas fa-utensils mr-1"></i> Lunch
                </button>
                <button onclick="filterCategory('Casho', this)" class="category-btn">
                    <i class="fas fa-drumstick-bite mr-1"></i> Dinner
                </button>
                <button onclick="filterCategory('Coffee', this)" class="category-btn">
                    <i class="fas fa-coffee mr-1"></i> Coffee
                </button>
                <button onclick="filterCategory('Shaah', this)" class="category-btn">
                    <i class="fas fa-mug-hot mr-1"></i> Tea
                </button>
                <button onclick="filterCategory('Cabitaan', this)" class="category-btn">
                    <i class="fas fa-glass-water mr-1"></i> Drinks
                </button>
                <button onclick="filterCategory('Macmacaan', this)" class="category-btn">
                    <i class="fas fa-ice-cream mr-1"></i> Desserts
                </button>
            </div>
        </div>

        <!-- Menu Grid - NO ADMIN BUTTONS VISIBLE -->
        <div id="menu-items" class="menu-grid">
            <!-- Loading skeletons -->
            <div class="bg-gray-200 rounded-2xl h-64 animate-pulse"></div>
            <div class="bg-gray-200 rounded-2xl h-64 animate-pulse"></div>
            <div class="bg-gray-200 rounded-2xl h-64 animate-pulse"></div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
            <i class="fas fa-search text-5xl text-gray-300 mb-3"></i>
            <p class="text-gray-500">No items found</p>
        </div>
    </main>

    <!-- Cart Bar - Only shows when items are in cart -->
    <div id="checkout-bar" class="cart-bar">
        <div class="max-w-7xl mx-auto">
            <!-- Cart Items Summary -->
            <div id="cart-summary" class="mb-3 max-h-32 overflow-y-auto no-scrollbar space-y-2"></div>
            
            <!-- Total and Checkout -->
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500">Total</p>
                    <p id="total-price" class="text-2xl sm:text-3xl font-black text-red-600">$0.00</p>
                    <p id="item-count-text" class="text-xs text-gray-400">0 items</p>
                </div>
                <button onclick="checkoutToKitchen()" class="bg-gradient-to-r from-green-500 to-green-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all flex items-center gap-2 text-lg">
                    <i class="fas fa-paper-plane"></i>
                    <span>Order Now</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const GOOGLE_URL = "YOUR_DEPLOYED_SCRIPT_URL_HERE"; // Replace with your Apps Script URL
        let menuData = JSON.parse(localStorage.getItem('tufaax_cache')) || [];
        let cart = JSON.parse(localStorage.getItem('tufaax_cart')) || [];
        let currentCategory = 'Dhammaan';
        let isLoading = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tableId = urlParams.get('table') || '';
            if (tableId) {
                document.getElementById('display-table').querySelector('span').textContent = tableId;
                document.getElementById('display-table').classList.remove('hidden');
            }
            
            if (menuData.length > 0) updateUI();
            loadMenu();
            setInterval(loadMenu, 1000);
        });

        // Load menu from server
        async function loadMenu() {
            if (isLoading) return;
            try {
                isLoading = true;
                const res = await fetch(GOOGLE_URL);
                if (!res.ok) throw new Error();
                const data = await res.json();
                // Only show visible items to customers
                const visibleItems = data.filter(item => item.status !== 'hidden');
                
                if (JSON.stringify(visibleItems) !== JSON.stringify(menuData)) {
                    menuData = visibleItems;
                    localStorage.setItem('tufaax_cache', JSON.stringify(menuData));
                    updateUI();
                }
            } catch (error) {
                console.error('Load error:', error);
            } finally {
                isLoading = false;
            }
        }

        // Update UI - NO ADMIN BUTTONS HERE
        function updateUI() {
            const container = document.getElementById('menu-items');
            const searchTerm = document.getElementById('custSearch').value.toLowerCase();
            document.getElementById('clear-search').classList.toggle('hidden', !searchTerm);

            // Filter by category and search
            let filtered = currentCategory === 'Dhammaan' ? menuData : menuData.filter(i => i.category === currentCategory);
            
            if (searchTerm) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(searchTerm) ||
                    (item.description && item.description.toLowerCase().includes(searchTerm))
                );
            }

            // Empty state
            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-state').classList.add('hidden');
            }

            // Render items - NO ADMIN BUTTONS, ONLY CUSTOMER CONTROLS
            container.innerHTML = filtered.map(item => {
                const count = cart.filter(c => String(c.id) === String(item.id)).length;
                return `
                <div class="item-card">
                    <div class="relative">
                        <img src="${item.img}" class="w-full h-36 sm:h-40 object-cover" onerror="this.src='https://via.placeholder.com/300/dc2626/ffffff?text=Tufaax'">
                        ${count > 0 ? `<div class="absolute top-2 right-2 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-full">${count}</div>` : ''}
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-black text-gray-800 text-sm mb-1">${item.name}</h3>
                        <p class="text-xs text-gray-400 line-clamp-2 mb-2 flex-1">${item.description || 'Delicious food'}</p>
                        <div class="flex items-center justify-between mt-2">
                            <span class="price-tag">$${parseFloat(item.price).toFixed(2)}</span>
                            <div class="flex items-center gap-1">
                                <button onclick="removeFromCart('${item.id}')" class="quantity-btn minus" ${count === 0 ? 'disabled' : ''}>
                                    <i class="fas fa-minus text-xs"></i>
                                </button>
                                <span class="font-bold w-6 text-center">${count}</span>
                                <button onclick="addToCart('${item.id}')" class="quantity-btn plus">
                                    <i class="fas fa-plus text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            updateCartDisplay();
        }

        // Cart functions
        function addToCart(id) {
            const item = menuData.find(m => String(m.id) === String(id));
            if (item) {
                cart.push({ id: item.id, name: item.name, price: parseFloat(item.price) });
                updateUI();
            }
        }

        function removeFromCart(id) {
            const idx = cart.findLastIndex(c => String(c.id) === String(id));
            if (idx > -1) {
                cart.splice(idx, 1);
                updateUI();
            }
        }

        function updateCartDisplay() {
            document.getElementById('cart-count').textContent = cart.length;
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('total-price').textContent = `$${total.toFixed(2)}`;
            
            const uniqueItems = new Set(cart.map(i => i.id)).size;
            document.getElementById('item-count-text').textContent = `${cart.length} item${cart.length !== 1 ? 's' : ''}`;
            
            const cartBar = document.getElementById('checkout-bar');
            if (cart.length > 0) {
                cartBar.classList.add('visible');
                
                // Group items for summary
                const grouped = cart.reduce((acc, item) => {
                    acc[item.name] = (acc[item.name] || 0) + 1;
                    return acc;
                }, {});
                
                document.getElementById('cart-summary').innerHTML = Object.entries(grouped)
                    .map(([name, qty]) => `
                        <div class="flex justify-between text-sm bg-gray-50 rounded-lg px-3 py-2">
                            <span class="font-medium">${qty}x ${name}</span>
                        </div>
                    `).join('');
            } else {
                cartBar.classList.remove('visible');
            }
            
            localStorage.setItem('tufaax_cart', JSON.stringify(cart));
        }

        // Filter by category
        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('custSearch').value = '';
            updateUI();
        }

        function clearSearch() {
            document.getElementById('custSearch').value = '';
            updateUI();
        }

        function toggleCart() {
            const cartBar = document.getElementById('checkout-bar');
            if (cartBar.classList.contains('visible')) {
                cartBar.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Checkout to kitchen
        function checkoutToKitchen() {
            if (cart.length === 0) {
                alert('Please add items to your cart');
                return;
            }
            
            const tableId = new URLSearchParams(window.location.search).get('table') || '1';
            
            // Group items
            const groupedItems = cart.reduce((acc, item) => {
                const key = item.name;
                if (!acc[key]) {
                    acc[key] = { name: item.name, quantity: 1 };
                } else {
                    acc[key].quantity += 1;
                }
                return acc;
            }, {});

            const itemsWithQuantity = Object.values(groupedItems);
            
            const orderData = {
                id: 'ORD-' + Date.now(),
                table: tableId,
                items: itemsWithQuantity,
                itemsString: JSON.stringify(cart),
                status: 'active',
                timestamp: new Date().toISOString(),
                orderNumber: Math.floor(Math.random() * 9000) + 1000,
                timeReceived: new Date().toLocaleTimeString()
            };
            
            // Save to kitchen (admin panel will pick this up)
            const kitchenOrders = JSON.parse(localStorage.getItem('tufaax_kitchen_orders')) || [];
            kitchenOrders.unshift(orderData);
            localStorage.setItem('tufaax_kitchen_orders', JSON.stringify(kitchenOrders));
            
            // Show success modal
            document.getElementById('orderNumberDisplay').textContent = '#' + orderData.orderNumber;
            document.getElementById('orderItemsDisplay').innerHTML = itemsWithQuantity
                .map(item => `<div class="flex justify-between"><span>${item.quantity}x ${item.name}</span></div>`).join('');
            
            document.getElementById('successModal').style.display = 'flex';
            
            // Clear cart
            cart = [];
            updateUI();
            
            // Auto close modal after 4 seconds
            setTimeout(closeModal, 4000);
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }

        // Expose functions globally
        window.updateUI = updateUI;
        window.filterCategory = filterCategory;
        window.clearSearch = clearSearch;
        window.toggleCart = toggleCart;
        window.checkoutToKitchen = checkoutToKitchen;
        window.addToCart = addToCart;
        window.removeFromCart = removeFromCart;
        window.closeModal = closeModal;
    </script>
</body>
</html>
