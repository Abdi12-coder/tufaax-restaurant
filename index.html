<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax Restaurant - Smart Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div class="bg-red-600 text-white p-6 text-center rounded-b-3xl shadow-lg">
        <h1 class="text-3xl font-bold italic text-white">🍎 Tufaax Restaurant</h1>
        <p id="table-display" class="text-sm mt-2 font-bold bg-white text-red-600 inline-block px-3 py-1 rounded-full">Soo dhowaada!</p>
    </div>

    <div class="p-4 max-w-md mx-auto">
        <h2 class="text-lg font-bold text-gray-700 mb-4 border-l-4 border-red-600 pl-2">Qadada & Dalabka</h2>
        
        <div class="space-y-4" id="menu-list">
            <div class="bg-white flex p-3 rounded-xl shadow-sm items-center justify-between">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-red-100 rounded-lg mr-3 flex items-center justify-center text-2xl">🍝</div>
                    <div>
                        <h3 class="font-semibold">Baasto Special</h3>
                        <p class="text-red-600 font-bold">$4.50</p>
                    </div>
                </div>
                <button onclick="sendOrder('Baasto Special', '4.50')" class="bg-green-500 text-white p-2 px-4 rounded-lg font-bold">Dalbo</button>
            </div>

            <div class="bg-white flex p-3 rounded-xl shadow-sm items-center justify-between">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-red-100 rounded-lg mr-3 flex items-center justify-center text-2xl">🍚</div>
                    <div>
                        <h3 class="font-semibold">Bariis Isku-dhex</h3>
                        <p class="text-red-600 font-bold">$5.00</p>
                    </div>
                </div>
                <button onclick="sendOrder('Bariis Isku-dhex', '5.00')" class="bg-green-500 text-white p-2 px-4 rounded-lg font-bold">Dalbo</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Hel Lambarka Miiska ee Link-ga ku jira
        const urlParams = new URLSearchParams(window.location.search);
        const tableNum = urlParams.get('table') || "Guri";
        document.getElementById('table-display').innerText = `Miiska: ${tableNum}`;

        function sendOrder(item, price) {
            const myNumber = "252617054480"; // <--- HALKAAN GELI LAMBARKAAGA
            const text = `*DALAB CUSUB* 🍎\n\n📍 *Miiska:* ${tableNum}\n🍴 *Cuntada:* ${item}\n💰 *Qiimaha:* $${price}`;
            const encodedText = encodeURIComponent(text);
            window.location.href = `https://wa.me/${myNumber}?text=${encodedText}`;
        }
    </script>
</body>
</html>
