<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tufaax Admin - Full Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .processing { opacity: 0.5; pointer-events: none; }
        #custom-popup { display: none; }
    </style>
</head>
<body class="bg-slate-50 p-4 pb-20">

    <div id="custom-popup" class="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full shadow-2xl text-center">
            <div id="popup-icon-box" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5">
                <i id="popup-icon" class="fas text-3xl"></i>
            </div>
            <h3 id="popup-title" class="font-black text-xl">Ma hubtaa?</h3>
            <p id="popup-msg" class="text-gray-500 mt-2 text-sm"></p>
            <div class="flex gap-3 mt-8">
                <button onclick="closePopup()" class="flex-1 bg-gray-100 p-4 rounded-2xl font-bold text-gray-600">Xir</button>
                <button id="popup-confirm-btn" class="flex-1 p-4 rounded-2xl font-bold text-white shadow-lg">Haa</button>
            </div>
        </div>
    </div>

    <div class="max-w-xl mx-auto space-y-6">
        <header class="bg-gray-800 text-white p-6 rounded-[2rem] shadow-xl flex justify-between items-center border-b-4 border-red-500">
            <div>
                <h1 class="text-2xl font-black italic">🍎 TUFAAX ADMIN</h1>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Maamul xogta si toos ah</p>
            </div>
            <div class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-[10px] flex items-center gap-2 border border-green-500/30">
                <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span></span>
                LIVE
            </div>
        </header>

        <div class="bg-white p-2 rounded-2xl shadow-sm border border-gray-100 flex items-center px-4">
            <i class="fas fa-search text-gray-400 mr-2"></i>
            <input type="text" id="adminSearch" oninput="renderAdminList()" placeholder="Raadi magaca ama category-ga..." class="w-full p-2 outline-none bg-transparent text-sm">
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100 space-y-4">
            <div class="flex justify-between items-center">
                <h2 id="form-title" class="font-black text-gray-800 flex items-center gap-2">
                    <i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto
                </h2>
                <button id="cancelBtn" onclick="resetForm()" class="hidden text-xs bg-red-50 text-red-500 px-3 py-1 rounded-full font-bold">Cancel</button>
            </div>
            
            <div class="space-y-3">
                <input id="foodId" type="hidden">
                <input id="foodStatus" type="hidden" value="visible">
                
                <input id="foodName" type="text" placeholder="Magaca Cuntada" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-red-400 transition-all">
                
                <textarea id="foodDesc" placeholder="Faahfaahinta Cuntada (Description)..." class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-red-400 transition-all h-20 resize-none"></textarea>

                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <span class="absolute left-4 top-4 text-gray-400">$</span>
                        <input id="foodPrice" type="number" step="0.01" placeholder="Qiimaha" class="w-full p-4 pl-8 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-red-400">
                    </div>
                    <select id="foodCat" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-red-400 font-bold text-gray-600">
                        <option>Quraac</option><option>Qado</option><option>Casho</option>
                        <option>Coffee</option><option>Shaah</option><option>Cabitaan</option><option>Macmacaan</option>
                    </select>
                </div>

                <div class="flex flex-col gap-2">
                    <input id="foodImg" type="text" placeholder="Link-ga Sawirka (URL)" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-red-400">
                    <label class="bg-blue-50 text-blue-600 p-4 rounded-2xl border border-dashed border-blue-200 cursor-pointer hover:bg-blue-100 transition text-center text-xs font-bold">
                        <i class="fas fa-camera mr-2"></i> <span id="uploadStatus">Upload Sawir</span>
                        <input type="file" accept="image/*" class="hidden" onchange="uploadImage(this)">
                    </label>
                </div>

                <button id="saveBtn" onclick="saveFood()" class="w-full bg-red-600 text-white p-5 rounded-[1.5rem] font-black shadow-lg shadow-red-200 active:scale-95 transition-all uppercase tracking-widest">
                    Keydi Xogta
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-black text-gray-800">Cuntooyinka Jira</h2>
                <span id="item-count" class="bg-gray-800 text-white text-[10px] px-3 py-1 rounded-full font-bold">0</span>
            </div>
            <div id="admin-list" class="space-y-3">
                <p class="text-center py-10 text-gray-400 italic text-xs">Loading data...</p>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwvlVabE9cWmBlBeMuc5rvCLd_aBrkNghlAelObrkqGouDFrU6F6q4_ggw_5M5xeGrI/exec"; 
        let menu = [];

        function uploadImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                document.getElementById('uploadStatus').innerText = "Diyaarinta sawirka...";
                reader.onload = e => {
                    document.getElementById('foodImg').value = e.target.result;
                    document.getElementById('uploadStatus').innerText = "Sawirka waa diyaar ✅";
                };
                reader.readAsDataURL(file);
            }
        }

        async function loadAdminMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                const newData = await res.json();
                if (JSON.stringify(menu) !== JSON.stringify(newData)) {
                    menu = newData;
                    document.getElementById('item-count').innerText = menu.length;
                    renderAdminList();
                }
            } catch (e) { console.error("Sync error"); }
        }

        function renderAdminList() {
            const searchTerm = document.getElementById('adminSearch').value.toLowerCase();
            const list = document.getElementById('admin-list');
            const filtered = menu.filter(i => i.name.toLowerCase().includes(searchTerm) || i.category.toLowerCase().includes(searchTerm));

            list.innerHTML = filtered.map(item => `
                <div id="row-${item.id}" class="flex items-center justify-between p-3 ${item.status === 'hidden' ? 'bg-red-50 grayscale' : 'bg-gray-50'} rounded-2xl border transition-all">
                    <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="prepareEdit('${item.id}')">
                        <img src="${item.img}" class="w-14 h-14 rounded-xl object-cover shadow-sm" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="overflow-hidden">
                            <p class="font-black text-sm text-gray-800">${item.name}</p>
                            <p class="text-[9px] text-red-500 font-bold uppercase">${item.category}</p>
                            <p class="text-[10px] text-gray-400 truncate w-40 italic">${item.description || 'No description'}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="triggerPopup('status', '${item.id}')" class="px-3 py-2 text-[9px] font-black border rounded-xl bg-white shadow-sm transition active:scale-90">
                            ${item.status === 'hidden' ? 'SHOW' : 'HIDE'}
                        </button>
                        <button onclick="triggerPopup('delete', '${item.id}')" class="w-9 h-9 flex items-center justify-center text-red-500 bg-red-50 rounded-xl active:scale-90 transition">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function saveFood() {
            const btn = document.getElementById('saveBtn');
            const data = {
                action: "update",
                id: document.getElementById('foodId').value || "ID-" + Date.now(),
                name: document.getElementById('foodName').value,
                description: document.getElementById('foodDesc').value,
                price: document.getElementById('foodPrice').value,
                category: document.getElementById('foodCat').value,
                img: document.getElementById('foodImg').value,
                status: document.getElementById('foodStatus').value
            };
            if(!data.name || !data.price) return alert("Fadlan buuxi Magaca iyo Qiimaha!");
            
            btn.innerText = "KAYDINTA...";
            btn.classList.add('processing');
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            
            setTimeout(() => {
                resetForm(); loadAdminMenu();
                btn.innerText = "KEYDI XOGTA"; btn.classList.remove('processing');
            }, 800);
        }

        function prepareEdit(id) {
            const item = menu.find(i => String(i.id) === String(id));
            if(!item) return;
            document.getElementById('foodId').value = item.id;
            document.getElementById('foodName').value = item.name;
            document.getElementById('foodDesc').value = item.description || "";
            document.getElementById('foodPrice').value = item.price;
            document.getElementById('foodCat').value = item.category;
            document.getElementById('foodImg').value = item.img;
            document.getElementById('foodStatus').value = item.status || "visible";
            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit text-orange-400"></i> Bedel: ${item.name}`;
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('foodId').value = "";
            document.getElementById('foodName').value = "";
            document.getElementById('foodDesc').value = "";
            document.getElementById('foodPrice').value = "";
            document.getElementById('foodImg').value = "";
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('uploadStatus').innerText = "Upload Sawir";
            document.getElementById('form-title').innerHTML = `<i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto`;
        }

        function triggerPopup(type, id) {
            const popup = document.getElementById('custom-popup');
            const confirmBtn = document.getElementById('popup-confirm-btn');
            const iconBox = document.getElementById('popup-icon-box');
            popup.style.display = 'flex';

            if(type === 'delete') {
                document.getElementById('popup-title').innerText = "Ma tirtirtaa?";
                document.getElementById('popup-msg').innerText = "Xogtan dib looma soo celin karo.";
                confirmBtn.className = "flex-1 bg-red-600 p-4 rounded-2xl font-bold text-white";
                iconBox.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 bg-red-50 text-red-600";
                document.getElementById('popup-icon').className = "fas fa-trash-alt text-3xl";
                confirmBtn.onclick = async () => { 
                    closePopup(); document.getElementById(`row-${id}`).classList.add('processing');
                    await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", id: String(id) }) });
                    setTimeout(loadAdminMenu, 1000);
                };
            } else {
                document.getElementById('popup-title').innerText = "Badal Muuqaalka?";
                document.getElementById('popup-msg').innerText = "Ma rabtaa in cuntadan laga qariyo macaamiisha?";
                confirmBtn.className = "flex-1 bg-gray-800 p-4 rounded-2xl font-bold text-white";
                iconBox.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 bg-gray-100 text-gray-800";
                document.getElementById('popup-icon').className = "fas fa-eye-slash text-3xl";
                confirmBtn.onclick = async () => { 
                    closePopup(); document.getElementById(`row-${id}`).classList.add('processing');
                    const item = menu.find(i => String(i.id) === String(id));
                    const newStatus = item.status === 'hidden' ? 'visible' : 'hidden';
                    await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ ...item, action: "update", status: newStatus }) });
                    setTimeout(loadAdminMenu, 1000);
                };
            }
        }

        function closePopup() { document.getElementById('custom-popup').style.display = 'none'; }
        setInterval(loadAdminMenu, 500);
        loadAdminMenu();
    </script>
</body>
</html>
