<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tufaax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4 pb-20">
    <div class="max-w-xl mx-auto space-y-6">
        <header class="bg-gray-800 text-white p-6 rounded-3xl shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black italic">🍎 TUFAAX ADMIN</h1>
                <p class="text-[10px] text-gray-400">Maamul menu-ga si sax ah</p>
            </div>
            <button onclick="loadAdminMenu()" class="bg-gray-700 hover:bg-gray-600 transition p-2 rounded-full w-10 h-10 flex items-center justify-center">
                <i id="sync-icon" class="fas fa-sync-alt"></i>
            </button>
        </header>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 space-y-4">
            <h2 id="form-title" class="font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto Cusub
            </h2>
            <div class="space-y-3">
                <input id="foodId" type="hidden"> 
                <input id="foodStatus" type="hidden" value="visible">
                <input id="foodName" type="text" placeholder="Magaca Cuntada" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400 transition-all">
                <div class="grid grid-cols-2 gap-3">
                    <input id="foodPrice" type="number" step="0.01" placeholder="Qiimaha $" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400 transition-all">
                    <select id="foodCat" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                        <option>Quraac</option><option>Qado</option><option>Casho</option><option>Cabitaan</option><option>Macmacaan</option>
                    </select>
                </div>
                <input id="foodImg" type="text" placeholder="Link-ga Sawirka (URL)" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400 transition-all">
                <div class="flex gap-2 pt-2">
                    <button id="saveBtn" onclick="saveFood()" class="flex-1 bg-green-500 hover:bg-green-600 text-white p-5 rounded-2xl font-bold shadow-lg transition-all active:scale-95">KEYDI XOGTA</button>
                    <button id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-200 text-gray-600 px-6 rounded-2xl font-bold hover:bg-gray-300">Xir</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
            <h2 class="font-bold text-gray-800 mb-4 flex justify-between items-center">
                <span>Cuntooyinka Hadda Jira</span>
                <span id="item-count" class="text-xs bg-gray-100 px-2 py-1 rounded-full text-gray-500">0 Items</span>
            </h2>
            <div id="admin-list" class="space-y-3">
                <div class="text-center py-10"><i class="fas fa-spinner fa-spin text-2xl text-gray-300"></i></div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbxTAnR4eeg4k0hnuZgn4u-TuLOCKL43QHvD3BqlND6wg3fFNN9AMJX97FqaiUKNvxk-/exec";
        let menu = [];

        async function loadAdminMenu() {
            document.getElementById('sync-icon').classList.add('fa-spin');
            try {
                const res = await fetch(GOOGLE_URL);
                const data = await res.json();
                
                // Normalization: Hubi in keys-ka ay yihiin xaraf yar
                menu = data.map(item => {
                    let newItem = {};
                    for (let key in item) newItem[key.toLowerCase()] = item[key];
                    return newItem;
                }).filter(item => item.id);

                document.getElementById('item-count').innerText = `${menu.length} Items`;
                renderAdminList();
            } catch (e) { 
                document.getElementById('admin-list').innerHTML = "<p class='text-center text-red-500'>Cillad ayaa dhacday markii xogta la soo aqrinayay.</p>";
            } finally {
                document.getElementById('sync-icon').classList.remove('fa-spin');
            }
        }

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            if(menu.length === 0) {
                list.innerHTML = "<p class='text-center py-5 text-gray-400'>Menu-gu waa faaruq.</p>";
                return;
            }
            list.innerHTML = menu.map((item) => {
                const isHidden = String(item.status).toLowerCase() === 'hidden';
                return `
                <div class="flex items-center justify-between p-3 ${isHidden ? 'bg-red-50 border-red-100' : 'bg-gray-50 border-gray-100'} rounded-2xl border transition-all hover:shadow-sm">
                    <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="prepareEdit('${item.id}')">
                        <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover bg-white" onerror="this.src='https://via.placeholder.com/150'">
                        <div>
                            <p class="font-bold text-sm ${isHidden ? 'text-gray-400' : 'text-gray-800'}">${item.name}</p>
                            <p class="text-xs text-green-600 font-medium">$${parseFloat(item.price || 0).toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleVisibility('${item.id}')" class="p-2 px-3 text-[10px] font-black border rounded-xl bg-white shadow-sm hover:bg-gray-50">
                            ${isHidden ? '<i class="fas fa-eye-slash text-red-500"></i>' : '<i class="fas fa-eye text-green-500"></i>'}
                        </button>
                        <button onclick="deleteFood('${item.id}')" class="p-2 px-3 text-red-500 hover:bg-red-100 rounded-xl">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        async function saveFood() {
            const saveBtn = document.getElementById('saveBtn');
            const data = {
                action: "update",
                id: document.getElementById('foodId').value || "ID-" + Date.now(),
                name: document.getElementById('foodName').value.trim(),
                price: parseFloat(document.getElementById('foodPrice').value) || 0,
                category: document.getElementById('foodCat').value,
                img: document.getElementById('foodImg').value.trim() || "https://via.placeholder.com/150",
                status: document.getElementById('foodStatus').value
            };
            
            if(!data.name || data.price <= 0) return alert("Fadlan buuxi magaca iyo qiimaha!");

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> KEYDINTA...';
            
            try {
                await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                resetForm();
                setTimeout(loadAdminMenu, 1200); // Otomaatig ayuu u refresh gareynayaa
            } catch (err) {
                alert("Cillad ayaa dhacday!");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "KEYDI XOGTA";
            }
        }

        async function deleteFood(id) {
            if(!confirm("Ma hubtaa inaad tirtirto?")) return;
            // Instant UI Update
            menu = menu.filter(i => i.id != id);
            renderAdminList();
            
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", id: String(id) }) });
            setTimeout(loadAdminMenu, 1000);
        }

        async function toggleVisibility(id) {
            const item = menu.find(i => i.id == id);
            if(!item) return;
            
            const newStatus = (String(item.status).toLowerCase() === 'hidden') ? 'visible' : 'hidden';
            item.status = newStatus; // UI update
            renderAdminList();
            
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ ...item, action: "update", status: newStatus }) });
            setTimeout(loadAdminMenu, 800);
        }

        function prepareEdit(id) {
            const item = menu.find(i => i.id == id);
            if(!item) return;
            document.getElementById('foodId').value = item.id;
            document.getElementById('foodName').value = item.name;
            document.getElementById('foodPrice').value = item.price;
            document.getElementById('foodCat').value = item.category;
            document.getElementById('foodImg').value = item.img;
            document.getElementById('foodStatus').value = item.status;
            
            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit text-orange-500"></i> Wax ka beddel: ${item.name}`;
            document.getElementById('saveBtn').classList.replace('bg-green-500', 'bg-orange-500');
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('foodId').value = "";
            document.getElementById('foodName').value = "";
            document.getElementById('foodPrice').value = "";
            document.getElementById('foodImg').value = "";
            document.getElementById('foodStatus').value = "visible";
            document.getElementById('form-title').innerHTML = `<i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto Cusub`;
            document.getElementById('saveBtn').classList.replace('bg-orange-500', 'bg-green-500');
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        loadAdminMenu();
    </script>
</body>
</html>
