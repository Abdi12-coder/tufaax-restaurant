<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍎 Tufaax Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        .processing { 
            opacity: 0.6; 
            pointer-events: none;
        }
        
        #custom-popup { 
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .popup-content {
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(50px) scale(0.9); 
            }
            to { 
                opacity: 1;
                transform: translateY(0) scale(1); 
            }
        }
        
        .image-preview {
            max-height: 200px;
            transition: all 0.3s ease;
        }
        
        .stats-card {
            transition: all 0.3s ease;
        }
        
        .stats-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .tooltip {
            position: relative;
        }
        
        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .tooltip:hover::after {
            opacity: 1;
        }
        
        .success-animation {
            animation: successPulse 0.6s ease-out;
        }
        
        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 p-4 pb-20">

    <!-- Custom Popup -->
    <div id="custom-popup" class="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="popup-content bg-white rounded-[2.5rem] p-8 max-w-sm w-full shadow-2xl text-center">
            <div id="popup-icon-box" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5">
                <i id="popup-icon" class="fas text-3xl"></i>
            </div>
            <h3 id="popup-title" class="font-black text-xl mb-2"></h3>
            <p id="popup-msg" class="text-gray-500 text-sm leading-relaxed"></p>
            <div class="flex gap-3 mt-8">
                <button onclick="closePopup()" class="flex-1 bg-gray-100 hover:bg-gray-200 p-4 rounded-2xl font-bold text-gray-600 transition-all">
                    Xir
                </button>
                <button id="popup-confirm-btn" class="flex-1 p-4 rounded-2xl font-bold text-white shadow-lg transition-all hover:shadow-xl">
                    Haa
                </button>
            </div>
        </div>
    </div>

    <!-- Success Toast -->
    <div id="success-toast" class="fixed top-4 right-4 bg-green-500 text-white px-6 py-4 rounded-2xl shadow-2xl hidden z-50 flex items-center gap-3">
        <i class="fas fa-check-circle text-2xl"></i>
        <div>
            <p class="font-bold">Guul!</p>
            <p class="text-sm opacity-90">Waa la kaydiyey</p>
        </div>
    </div>

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-gray-800 to-gray-900 text-white p-6 rounded-[2rem] shadow-2xl border-b-4 border-red-500">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-black italic tracking-tight flex items-center gap-3">
                        🍎 TUFAAX ADMIN
                        <span class="text-xs bg-red-500 px-3 py-1 rounded-full font-bold animate-pulse">DASHBOARD</span>
                    </h1>
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mt-1">
                        Maamulka Menu-ga - Live System
                    </p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="bg-green-500/20 text-green-400 px-4 py-2 rounded-full text-xs flex items-center gap-2 border border-green-500/30">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                        </span>
                        LIVE
                    </div>
                    <button onclick="location.reload()" class="tooltip bg-white/10 hover:bg-white/20 p-3 rounded-xl transition-all" data-tooltip="Cusbooneysii">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="stats-card bg-gradient-to-br from-blue-500 to-blue-600 text-white p-6 rounded-2xl shadow-lg">
                <div class="flex justify-between items-start mb-3">
                    <div class="bg-white/20 p-3 rounded-xl">
                        <i class="fas fa-utensils text-2xl"></i>
                    </div>
                </div>
                <p class="text-3xl font-black" id="stat-total">0</p>
                <p class="text-sm opacity-90 font-semibold">Wadarta Items</p>
            </div>
            
            <div class="stats-card bg-gradient-to-br from-green-500 to-green-600 text-white p-6 rounded-2xl shadow-lg">
                <div class="flex justify-between items-start mb-3">
                    <div class="bg-white/20 p-3 rounded-xl">
                        <i class="fas fa-eye text-2xl"></i>
                    </div>
                </div>
                <p class="text-3xl font-black" id="stat-visible">0</p>
                <p class="text-sm opacity-90 font-semibold">Visible Items</p>
            </div>
            
            <div class="stats-card bg-gradient-to-br from-red-500 to-red-600 text-white p-6 rounded-2xl shadow-lg">
                <div class="flex justify-between items-start mb-3">
                    <div class="bg-white/20 p-3 rounded-xl">
                        <i class="fas fa-eye-slash text-2xl"></i>
                    </div>
                </div>
                <p class="text-3xl font-black" id="stat-hidden">0</p>
                <p class="text-sm opacity-90 font-semibold">Hidden Items</p>
            </div>
            
            <div class="stats-card bg-gradient-to-br from-purple-500 to-purple-600 text-white p-6 rounded-2xl shadow-lg">
                <div class="flex justify-between items-start mb-3">
                    <div class="bg-white/20 p-3 rounded-xl">
                        <i class="fas fa-th text-2xl"></i>
                    </div>
                </div>
                <p class="text-3xl font-black" id="stat-categories">0</p>
                <p class="text-sm opacity-90 font-semibold">Categories</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="bg-white p-3 rounded-2xl shadow-md border border-gray-200 flex items-center px-5">
            <i class="fas fa-search text-gray-400 mr-3 text-lg"></i>
            <input 
                type="text" 
                id="adminSearch" 
                oninput="renderAdminList()" 
                placeholder="Raadi magaca, category-ga ama qiimaha..." 
                class="w-full p-2 outline-none bg-transparent text-sm placeholder-gray-400"
            >
            <button onclick="clearAdminSearch()" id="clear-admin-search" class="hidden text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Add/Edit Form -->
        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 id="form-title" class="text-2xl font-black text-gray-800 flex items-center gap-3">
                    <i class="fas fa-plus-circle text-green-500"></i> 
                    <span>Ku dar Cunto Cusub</span>
                </h2>
                <button id="cancelBtn" onclick="resetForm()" class="hidden text-sm bg-red-50 hover:bg-red-100 text-red-600 px-5 py-2 rounded-full font-bold transition-all">
                    <i class="fas fa-times mr-1"></i> Cancel
                </button>
            </div>
            
            <div class="space-y-4">
                <input id="foodId" type="hidden">
                <input id="foodStatus" type="hidden" value="visible">
                
                <!-- Image Preview -->
                <div id="image-preview-container" class="hidden">
                    <img id="image-preview" class="image-preview w-full rounded-2xl border-2 border-gray-200 object-cover mb-4">
                </div>
                
                <!-- Name Input -->
                <div>
                    <label class="text-xs font-bold text-gray-600 mb-2 block uppercase tracking-wide">Magaca Cuntada *</label>
                    <input 
                        id="foodName" 
                        type="text" 
                        placeholder="e.g. Bariis iyo Hilib" 
                        class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:ring-2 focus:ring-red-400 focus:border-transparent transition-all"
                        required
                    >
                </div>
                
                <!-- Description -->
                <div>
                    <label class="text-xs font-bold text-gray-600 mb-2 block uppercase tracking-wide">Faahfaahinta (Description)</label>
                    <textarea 
                        id="foodDesc" 
                        placeholder="Sharaxaad ku saabsan cuntada..." 
                        class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:ring-2 focus:ring-red-400 focus:border-transparent transition-all h-24 resize-none"
                    ></textarea>
                    <p class="text-xs text-gray-400 mt-1"><span id="desc-count">0</span>/200 xaraf</p>
                </div>

                <!-- Price and Category -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-600 mb-2 block uppercase tracking-wide">Qiimaha *</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold text-lg">$</span>
                            <input 
                                id="foodPrice" 
                                type="number" 
                                step="0.01" 
                                min="0"
                                placeholder="0.00" 
                                class="w-full p-4 pl-10 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:ring-2 focus:ring-red-400 focus:border-transparent transition-all"
                                required
                            >
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-xs font-bold text-gray-600 mb-2 block uppercase tracking-wide">Category *</label>
                        <select 
                            id="foodCat" 
                            class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:ring-2 focus:ring-red-400 focus:border-transparent font-bold text-gray-700 cursor-pointer transition-all"
                        >
                            <option value="Quraac">🍳 Quraac (Breakfast)</option>
                            <option value="Qado">🍛 Qado (Lunch)</option>
                            <option value="Casho">🍗 Casho (Dinner)</option>
                            <option value="Coffee">☕ Coffee</option>
                            <option value="Shaah">🍵 Shaah (Tea)</option>
                            <option value="Cabitaan">🥤 Cabitaan (Drinks)</option>
                            <option value="Macmacaan">🍰 Macmacaan (Desserts)</option>
                        </select>
                    </div>
                </div>

                <!-- Image Upload -->
                <div class="space-y-3">
                    <label class="text-xs font-bold text-gray-600 mb-2 block uppercase tracking-wide">Sawirka Cuntada</label>
                    
                    <input 
                        id="foodImg" 
                        type="url" 
                        placeholder="https://example.com/image.jpg" 
                        class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all"
                        oninput="previewImage(this.value)"
                    >
                    
                    <div class="text-center text-gray-400 text-xs font-bold">— AMA —</div>
                    
                    <label class="bg-gradient-to-r from-blue-50 to-blue-100 hover:from-blue-100 hover:to-blue-200 text-blue-600 p-5 rounded-2xl border-2 border-dashed border-blue-300 cursor-pointer transition-all text-center font-bold block">
                        <i class="fas fa-cloud-upload-alt text-2xl mb-2"></i>
                        <div>
                            <span id="uploadStatus">Upload Sawir (Base64)</span>
                            <p class="text-xs font-normal mt-1 opacity-75">JPG, PNG, GIF - Max 2MB</p>
                        </div>
                        <input 
                            type="file" 
                            accept="image/*" 
                            class="hidden" 
                            onchange="uploadImage(this)"
                        >
                    </label>
                </div>

                <!-- Submit Button -->
                <button 
                    id="saveBtn" 
                    onclick="saveFood()" 
                    class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white p-5 rounded-[1.5rem] font-black shadow-lg shadow-red-200 hover:shadow-xl active:scale-98 transition-all uppercase tracking-widest text-lg"
                >
                    <i class="fas fa-save mr-2"></i> KEYDI XOGTA
                </button>
            </div>
        </div>

        <!-- Menu Items List -->
        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-gray-800">📋 Cuntooyinka Jira</h2>
                <span id="item-count" class="bg-gray-800 text-white text-sm px-4 py-2 rounded-full font-black">0 Items</span>
            </div>
            
            <!-- Filter Buttons -->
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="filterStatus('all')" class="filter-btn active px-4 py-2 rounded-xl font-bold text-xs bg-gray-100 hover:bg-gray-200 transition-all whitespace-nowrap">
                    Dhammaan
                </button>
                <button onclick="filterStatus('visible')" class="filter-btn px-4 py-2 rounded-xl font-bold text-xs bg-gray-100 hover:bg-gray-200 transition-all whitespace-nowrap">
                    <i class="fas fa-eye mr-1"></i> Visible
                </button>
                <button onclick="filterStatus('hidden')" class="filter-btn px-4 py-2 rounded-xl font-bold text-xs bg-gray-100 hover:bg-gray-200 transition-all whitespace-nowrap">
                    <i class="fas fa-eye-slash mr-1"></i> Hidden
                </button>
            </div>
            
            <div id="admin-list" class="space-y-3">
                <div class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-red-600 mb-4"></div>
                    <p class="text-gray-500 font-bold">Soo dejinaya...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwOXK0H3RicHlPQSCM_6zEPN8IxZhv-uoCQYyg1wok2S0SYPXyhA6h445VWk3X8ttjr_w/exec";
        let menu = [];
        let currentFilter = 'all';
        let isProcessing = false;
        let lastDataHash = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadAdminMenu();
            setInterval(loadAdminMenu, 1000); // 1 second refresh
            
            document.getElementById('foodDesc').addEventListener('input', (e) => {
                const count = e.target.value.length;
                document.getElementById('desc-count').textContent = count;
                if (count > 200) {
                    e.target.value = e.target.value.substring(0, 200);
                }
            });
        });

        function hashData(data) {
            return JSON.stringify(data);
        }

        function uploadImage(input) {
            const file = input.files[0];
            if (!file) return;
            
            if (file.size > 2 * 1024 * 1024) {
                alert('Sawirku aad buu u weyn yahay! Fadlan dooro sawir ka yar 2MB');
                input.value = '';
                return;
            }
            
            if (!file.type.startsWith('image/')) {
                alert('Fadlan dooro sawir keliya (JPG, PNG, GIF)');
                input.value = '';
                return;
            }
            
            const reader = new FileReader();
            const statusEl = document.getElementById('uploadStatus');
            
            statusEl.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Diyaarinta sawirka...';
            
            reader.onload = e => {
                const base64 = e.target.result;
                document.getElementById('foodImg').value = base64;
                previewImage(base64);
                statusEl.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Sawirka waa diyaar ✅';
                
                setTimeout(() => {
                    statusEl.innerHTML = 'Upload Sawir (Base64)';
                }, 3000);
            };
            
            reader.onerror = () => {
                alert('Khalad ayaa dhacay markii la akhriyay sawirka');
                statusEl.innerHTML = 'Upload Sawir (Base64)';
            };
            
            reader.readAsDataURL(file);
        }

        function previewImage(url) {
            const preview = document.getElementById('image-preview');
            const container = document.getElementById('image-preview-container');
            
            if (url) {
                preview.src = url;
                preview.onerror = () => {
                    container.classList.add('hidden');
                };
                preview.onload = () => {
                    container.classList.remove('hidden');
                };
            } else {
                container.classList.add('hidden');
            }
        }

        async function loadAdminMenu() {
            if (isProcessing) return;
            
            try {
                isProcessing = true;
                
                const res = await fetch(GOOGLE_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('Network error');
                
                const newData = await res.json();
                const newHash = hashData(newData);
                
                if (newHash !== lastDataHash) {
                    menu = newData;
                    lastDataHash = newHash;
                    updateStatistics();
                    renderAdminList();
                }
            } catch (error) {
                console.error('Sync error:', error);
                if (menu.length === 0) {
                    document.getElementById('admin-list').innerHTML = `
                        <div class="text-center py-12">
                            <i class="fas fa-exclamation-triangle text-5xl text-red-400 mb-4"></i>
                            <p class="text-gray-600 font-bold mb-2">Xiriirka Internet-ka ayaa khaldan</p>
                            <button onclick="loadAdminMenu()" class="bg-red-600 text-white px-6 py-2 rounded-xl font-bold mt-4 hover:bg-red-700 transition-all">
                                <i class="fas fa-sync-alt mr-2"></i> Isku Day Mar Kale
                            </button>
                        </div>
                    `;
                }
            } finally {
                isProcessing = false;
            }
        }

        function updateStatistics() {
            const total = menu.length;
            const visible = menu.filter(i => i.status !== 'hidden').length;
            const hidden = menu.filter(i => i.status === 'hidden').length;
            const categories = [...new Set(menu.map(i => i.category))].length;
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-visible').textContent = visible;
            document.getElementById('stat-hidden').textContent = hidden;
            document.getElementById('stat-categories').textContent = categories;
            document.getElementById('item-count').textContent = `${total} Items`;
        }

        function renderAdminList() {
            const searchTerm = document.getElementById('adminSearch').value.toLowerCase();
            const searchBtn = document.getElementById('clear-admin-search');
            const list = document.getElementById('admin-list');
            
            searchBtn.classList.toggle('hidden', !searchTerm);
            
            let filtered = menu;
            
            if (currentFilter === 'visible') {
                filtered = filtered.filter(i => i.status !== 'hidden');
            } else if (currentFilter === 'hidden') {
                filtered = filtered.filter(i => i.status === 'hidden');
            }
            
            if (searchTerm) {
                filtered = filtered.filter(i => 
                    i.name.toLowerCase().includes(searchTerm) || 
                    i.category.toLowerCase().includes(searchTerm) ||
                    i.price.toString().includes(searchTerm) ||
                    (i.description && i.description.toLowerCase().includes(searchTerm))
                );
            }

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-search text-5xl text-gray-300 mb-4"></i>
                        <p class="text-gray-600 font-bold">Lama helin wax natiiijo ah</p>
                        <p class="text-gray-400 text-sm mt-2">Isku day eray kale ama dooro filter kale</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(item => `
                <div id="row-${item.id}" class="flex items-center justify-between p-4 ${item.status === 'hidden' ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-200'} rounded-2xl border-2 transition-all hover:shadow-md">
                    <div class="flex items-center gap-4 flex-1 cursor-pointer hover:opacity-80 transition-opacity" onclick="prepareEdit('${item.id}')">
                        <div class="relative">
                            <img 
                                src="${item.img}" 
                                class="w-16 h-16 rounded-xl object-cover shadow-md border-2 border-white" 
                                onerror="this.src='https://via.placeholder.com/150/dc2626/ffffff?text=No+Image'"
                            >
                            ${item.status === 'hidden' ? '<div class="absolute inset-0 bg-black/40 rounded-xl flex items-center justify-center"><i class="fas fa-eye-slash text-white text-xl"></i></div>' : ''}
                        </div>
                        <div class="overflow-hidden flex-1">
                            <p class="font-black text-base text-gray-800 truncate">${item.name}</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs text-white bg-red-500 px-2 py-0.5 rounded-full font-bold uppercase">${item.category}</span>
                                <span class="text-xs text-gray-500">•</span>
                                <span class="text-sm font-black text-red-600">$${parseFloat(item.price || 0).toFixed(2)}</span>
                            </div>
                            ${item.description ? `<p class="text-xs text-gray-400 truncate mt-1 italic">${item.description}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button 
                            onclick="triggerPopup('status', '${item.id}')" 
                            class="tooltip px-4 py-2 text-xs font-black border-2 rounded-xl ${item.status === 'hidden' ? 'bg-green-50 border-green-500 text-green-600' : 'bg-gray-50 border-gray-300 text-gray-600'} hover:shadow-md transition-all active:scale-95"
                            data-tooltip="${item.status === 'hidden' ? 'Muuji' : 'Qari'}"
                        >
                            <i class="fas fa-${item.status === 'hidden' ? 'eye' : 'eye-slash'}"></i>
                        </button>
                        <button 
                            onclick="triggerPopup('delete', '${item.id}')" 
                            class="tooltip w-10 h-10 flex items-center justify-center text-red-600 bg-red-50 border-2 border-red-200 rounded-xl hover:bg-red-100 active:scale-95 transition-all"
                            data-tooltip="Tirtir"
                        >
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function saveFood() {
            const btn = document.getElementById('saveBtn');
            const name = document.getElementById('foodName').value.trim();
            const price = document.getElementById('foodPrice').value;
            
            if (!name || !price) {
                alert('⚠️ Fadlan buuxi Magaca iyo Qiimaha!');
                return;
            }
            
            if (parseFloat(price) <= 0) {
                alert('⚠️ Qiimahu waa inuu ka weyn yahay 0!');
                return;
            }
            
            const data = {
                action: "update",
                id: document.getElementById('foodId').value || "ID-" + Date.now(),
                name: name,
                description: document.getElementById('foodDesc').value.trim(),
                price: parseFloat(price),
                category: document.getElementById('foodCat').value,
                img: document.getElementById('foodImg').value || 'https://via.placeholder.com/300/dc2626/ffffff?text=Tufaax',
                status: document.getElementById('foodStatus').value
            };
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> KAYDINTA...';
            btn.classList.add('processing');
            
            try {
                await fetch(GOOGLE_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(data) 
                });
                
                setTimeout(() => {
                    showSuccessToast();
                    resetForm();
                    loadAdminMenu();
                    btn.innerHTML = '<i class="fas fa-save mr-2"></i> KEYDI XOGTA';
                    btn.classList.remove('processing');
                }, 800);
            } catch (error) {
                alert('❌ Khalad ayaa dhacay! Isku day mar kale.');
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> KEYDI XOGTA';
                btn.classList.remove('processing');
            }
        }

        function prepareEdit(id) {
            const item = menu.find(i => String(i.id) === String(id));
            if (!item) return;
            
            document.getElementById('foodId').value = item.id;
            document.getElementById('foodName').value = item.name;
            document.getElementById('foodDesc').value = item.description || "";
            document.getElementById('foodPrice').value = item.price;
            document.getElementById('foodCat').value = item.category;
            document.getElementById('foodImg').value = item.img;
            document.getElementById('foodStatus').value = item.status || "visible";
            
            document.getElementById('desc-count').textContent = (item.description || "").length;
            previewImage(item.img);
            
            document.getElementById('form-title').innerHTML = `
                <i class="fas fa-edit text-orange-500"></i> 
                <span>Bedel: ${item.name}</span>
            `;
            document.getElementById('cancelBtn').classList.remove('hidden');
            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save mr-2"></i> CUSBOONEYSII';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('foodId').value = "";
            document.getElementById('foodName').value = "";
            document.getElementById('foodDesc').value = "";
            document.getElementById('foodPrice').value = "";
            document.getElementById('foodImg').value = "";
            document.getElementById('foodStatus').value = "visible";
            document.getElementById('foodCat').selectedIndex = 0;
            document.getElementById('desc-count').textContent = "0";
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('uploadStatus').innerHTML = 'Upload Sawir (Base64)';
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('form-title').innerHTML = `
                <i class="fas fa-plus-circle text-green-500"></i> 
                <span>Ku dar Cunto Cusub</span>
            `;
            document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save mr-2"></i> KEYDI XOGTA';
        }

        function triggerPopup(type, id) {
            const popup = document.getElementById('custom-popup');
            const confirmBtn = document.getElementById('popup-confirm-btn');
            const iconBox = document.getElementById('popup-icon-box');
            const item = menu.find(i => String(i.id) === String(id));
            
            popup.style.display = 'flex';

            if (type === 'delete') {
                document.getElementById('popup-title').innerText = "Ma tirtirtaa?";
                document.getElementById('popup-msg').innerText = `"${item.name}" ayaa la tiridoonaa. Xogtan dib looma soo celin karo.`;
                confirmBtn.className = "flex-1 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 p-4 rounded-2xl font-bold text-white transition-all";
                iconBox.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 bg-red-50 text-red-600 border-4 border-red-100";
                document.getElementById('popup-icon').className = "fas fa-trash-alt text-3xl";
                
                confirmBtn.onclick = async () => { 
                    closePopup();
                    const row = document.getElementById(`row-${id}`);
                    if (row) row.classList.add('processing');
                    
                    await fetch(GOOGLE_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        body: JSON.stringify({ action: "delete", id: String(id) }) 
                    });
                    
                    setTimeout(() => {
                        loadAdminMenu();
                        showSuccessToast();
                    }, 1000);
                };
            } else {
                const newStatus = item.status === 'hidden' ? 'visible' : 'hidden';
                document.getElementById('popup-title').innerText = "Badal Muuqaalka?";
                document.getElementById('popup-msg').innerText = newStatus === 'hidden' 
                    ? `"${item.name}" laga qarin doonaa macaamiisha.` 
                    : `"${item.name}" loo muujin doonaa macaamiisha.`;
                confirmBtn.className = "flex-1 bg-gradient-to-r from-gray-700 to-gray-800 hover:from-gray-800 hover:to-gray-900 p-4 rounded-2xl font-bold text-white transition-all";
                iconBox.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 bg-gray-100 text-gray-800 border-4 border-gray-200";
                document.getElementById('popup-icon').className = `fas fa-${newStatus === 'hidden' ? 'eye-slash' : 'eye'} text-3xl`;
                
                confirmBtn.onclick = async () => { 
                    closePopup();
                    const row = document.getElementById(`row-${id}`);
                    if (row) row.classList.add('processing');
                    
                    await fetch(GOOGLE_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        body: JSON.stringify({ ...item, action: "update", status: newStatus }) 
                    });
                    
                    setTimeout(() => {
                        loadAdminMenu();
                        showSuccessToast();
                    }, 1000);
                };
            }
        }

        function closePopup() { 
            document.getElementById('custom-popup').style.display = 'none'; 
        }

        function filterStatus(status) {
            currentFilter = status;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-red-600', 'text-white');
                btn.classList.add('bg-gray-100', 'hover:bg-gray-200');
            });
            
            event.target.classList.add('active', 'bg-red-600', 'text-white');
            event.target.classList.remove('bg-gray-100', 'hover:bg-gray-200');
            
            renderAdminList();
        }

        function clearAdminSearch() {
            document.getElementById('adminSearch').value = '';
            renderAdminList();
        }

        function showSuccessToast() {
            const toast = document.getElementById('success-toast');
            toast.classList.remove('hidden');
            toast.classList.add('success-animation');
            
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('success-animation');
            }, 3000);
        }

        const style = document.createElement('style');
        style.textContent = `
            .filter-btn.active {
                background: linear-gradient(135deg, #dc2626, #991b1b) !important;
                color: white !important;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
