<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tufaax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .loading-overlay { background: rgba(255,255,255,0.7); display: none; }
    </style>
</head>
<body class="bg-slate-50 p-4 pb-20">
    <div class="max-w-xl mx-auto space-y-6">
        <header class="bg-gray-800 text-white p-6 rounded-3xl shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black italic uppercase tracking-wider">🍎 Tufaax Admin</h1>
                <p class="text-[10px] text-gray-400">Maamul Menu-gaaga si fudud</p>
            </div>
            <a href="index.html" target="_blank" class="bg-red-600 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-700 transition">Arag Menu-ga</a>
        </header>

        <div id="form-container" class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 space-y-4">
            <h2 id="form-title" class="font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto Cusub
            </h2>
            <div class="space-y-3">
                <input id="foodId" type="hidden"> 
                <input id="foodStatus" type="hidden" value="visible">
                
                <div class="relative">
                    <i class="fas fa-utensils absolute left-4 top-4 text-gray-300"></i>
                    <input id="foodName" type="text" placeholder="Magaca Cuntada" class="w-full p-4 pl-12 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <i class="fas fa-dollar-sign absolute left-4 top-4 text-gray-300"></i>
                        <input id="foodPrice" type="number" step="0.01" placeholder="Qiimaha" class="w-full p-4 pl-10 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                    </div>
                    <select id="foodCat" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                        <option>Quraac</option><option>Qado</option><option>Casho</option><option>Cabitaan</option><option>Macmacaan</option>
                    </select>
                </div>

                <div class="relative">
                    <i class="fas fa-image absolute left-4 top-4 text-gray-300"></i>
                    <input id="foodImg" type="text" placeholder="Link-ga Sawirka (URL)" class="w-full p-4 pl-12 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                </div>
                
                <div class="flex gap-2 pt-2">
                    <button id="saveBtn" onclick="saveFood()" class="flex-1 bg-green-500 text-white p-5 rounded-2xl font-black shadow-lg hover:bg-green-600 transition disabled:bg-gray-400">
                        <span id="btnText">KEYDI XOGTA</span>
                    </button>
                    <button id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-200 text-gray-600 px-6 rounded-2xl font-bold hover:bg-gray-300 transition">Xir</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-list text-blue-500"></i> Menu-ga Hadda
                </h2>
                <button onclick="loadAdminMenu()" class="text-xs text-blue-500 font-bold"><i class="fas fa-sync-alt"></i> Cusboonaysii</button>
            </div>
            
            <div id="admin-list" class="space-y-3 min-h-[100px] relative">
                <div class="text-center py-10 text-gray-400">
                    <i class="fas fa-spinner fa-spin text-2xl"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzZPWtj8QEWtmUdtdiAC8PJ5bngZZqEuqUT65vK63g3an9z6wu5uJibg7YmNaktFmAx/exec";
        let menuData = [];

        // 1. Soo rido xogta
        async function loadAdminMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                const data = await res.json();
                menuData = data;
                renderAdminList();
            } catch (e) {
                console.error("Xogta lama soo celin karo");
            }
        }

        // 2. Soo bandhig liiska
        function renderAdminList() {
            const list = document.getElementById('admin-list');
            if (menuData.length === 0) {
                list.innerHTML = `<p class="text-sm italic text-center py-10 text-gray-400">Menu-gaagu waa madhan yahay.</p>`;
                return;
            }

            list.innerHTML = menuData.map((item) => `
                <div class="flex items-center justify-between p-3 rounded-2xl border transition-all ${item.status === 'hidden' ? 'bg-red-50 border-red-100 opacity-70' : 'bg-gray-50 border-gray-100'}">
                    <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="prepareEdit('${item.id}')">
                        <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover bg-gray-200" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="text-left">
                            <p class="font-bold text-gray-800 text-sm">${item.name} ${item.status === 'hidden' ? '🚫' : ''}</p>
                            <p class="text-xs font-bold text-green-600">$${parseFloat(item.price).toFixed(2)}</p>
                        </div>
                    </div>
                    <button onclick="toggleVisibility('${item.id}')" class="ml-2 px-4 py-2 rounded-xl text-[10px] font-black shadow-sm transition-all ${item.status === 'hidden' ? 'bg-gray-800 text-white' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-100'}">
                        ${item.status === 'hidden' ? 'SHOW' : 'HIDE'}
                    </button>
                </div>
            `).join('');
        }

        // 3. Diyaari edit-ka (Halkan ayaan ka saxnay Copy-ga)
        function prepareEdit(id) {
            const item = menuData.find(i => i.id == id);
            if(!item) return;

            // Buuxi foomka
            document.getElementById('foodId').value = item.id;
            document.getElementById('foodName').value = item.name;
            document.getElementById('foodPrice').value = item.price;
            document.getElementById('foodCat').value = item.category;
            document.getElementById('foodImg').value = item.img;
            document.getElementById('foodStatus').value = item.status || 'visible';

            // Beddel UI-ga
            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit text-orange-500"></i> Wax ka beddel: ${item.name}`;
            document.getElementById('btnText').innerText = "CUSBOONAYSIYI";
            document.getElementById('cancelBtn').classList.remove('hidden');
            
            // Kor u qaad screen-ka
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. Nadiifi foomka
        function resetForm() {
            document.getElementById('foodId').value = "";
            document.getElementById('foodName').value = "";
            document.getElementById('foodPrice').value = "";
            document.getElementById('foodImg').value = "";
            document.getElementById('foodStatus').value = "visible";
            
            document.getElementById('form-title').innerHTML = `<i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto Cusub`;
            document.getElementById('btnText').innerText = "KEYDI XOGTA";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        // 5. Badbaadi xogta (Cusub iyo Edit labadaba)
        async function saveFood() {
            const idInput = document.getElementById('foodId').value;
            const name = document.getElementById('foodName').value.trim();
            const price = document.getElementById('foodPrice').value;
            const cat = document.getElementById('foodCat').value;
            const img = document.getElementById('foodImg').value.trim() || "https://via.placeholder.com/150";
            const status = document.getElementById('foodStatus').value;

            if(!name || !price) return alert("Fadlan magaca iyo qiimaha geli!");

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            document.getElementById('btnText').innerText = "SHAQADAA SOO SOCOTA...";

            // Haddi ID-gu jiro waa EDIT, haddii kale waa mid cusub (ID cusub sii)
            const finalId = idInput || "ID-" + Date.now();
            const data = { id: finalId, name, price: parseFloat(price), category: cat, img, status };

            try {
                // No-cors mode doesn't return response, but we trigger the push
                await fetch(GOOGLE_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(data) 
                });
                
                alert("Waa lagu guuleystay!");
                resetForm();
                setTimeout(loadAdminMenu, 1000); // Sug wax yar ka hor intaanan dib u soo rarin
            } catch (e) { 
                alert("Khalad ayaa dhacay!"); 
            } finally { 
                saveBtn.disabled = false; 
            }
        }

        // 6. Qari ama Tus (Optimized)
        async function toggleVisibility(id) {
            const item = menuData.find(i => i.id == id);
            if(!item) return;
            
            const originalStatus = item.status;
            const newStatus = originalStatus === 'hidden' ? 'visible' : 'hidden';
            
            // 1. Update LOCAL UI (Dhakhso)
            item.status = newStatus;
            renderAdminList();

            // 2. Update CLOUD (Gadaal)
            try {
                await fetch(GOOGLE_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ ...item, status: newStatus }) 
                });
            } catch (e) {
                // Haddii uu khaldamo dib u soo celi kii hore
                item.status = originalStatus;
                renderAdminList();
                alert("Cloud-ka lama gaadhi karo!");
            }
        }

        // Marka hore soo rido
        loadAdminMenu();
    </script>
</body>
</html>
