<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tufaax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4 pb-20">
    <div id="custom-popup" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full shadow-2xl text-center">
            <h3 id="popup-title" class="font-black text-xl text-gray-800">Ma hubtaa?</h3>
            <div class="flex gap-3 mt-8">
                <button onclick="closePopup()" class="flex-1 bg-gray-100 p-4 rounded-2xl font-bold">Xir</button>
                <button id="popup-confirm-btn" class="flex-1 bg-red-500 p-4 rounded-2xl font-bold text-white">Haa</button>
            </div>
        </div>
    </div>

    <div class="max-w-xl mx-auto space-y-6">
        <header class="bg-gray-800 text-white p-6 rounded-[2rem] flex justify-between items-center">
            <h1 class="text-xl font-black italic">🍎 TUFAAX ADMIN</h1>
            <div class="text-green-400 text-[10px] font-bold animate-pulse">● LIVE</div>
        </header>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm space-y-4">
            <h2 id="form-title" class="font-bold text-gray-800">Ku dar Cunto Cusub</h2>
            <div class="space-y-3">
                <input id="foodId" type="hidden">
                <input id="foodName" type="text" placeholder="Magaca Cuntada" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <textarea id="foodDesc" placeholder="Faahfaahinta (Description)" class="w-full p-4 bg-gray-50 rounded-2xl outline-none h-20"></textarea>
                <div class="grid grid-cols-2 gap-3">
                    <input id="foodPrice" type="number" step="0.01" placeholder="Qiimaha $" class="p-4 bg-gray-50 rounded-2xl outline-none">
                    <select id="foodCat" class="p-4 bg-gray-50 rounded-2xl outline-none">
                        <option>Quraac</option><option>Qado</option><option>Casho</option>
                        <option>Coffee</option><option>Shaah</option><option>Cabitaan</option><option>Macmacaan</option>
                    </select>
                </div>
                <input id="foodImg" type="text" placeholder="Link-ga Sawirka" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <button id="saveBtn" onclick="saveFood()" class="w-full bg-green-500 text-white p-5 rounded-2xl font-bold shadow-lg">KEYDI XOGTA</button>
            </div>
        </div>

        <div id="admin-list" class="space-y-3"></div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwk9qt-H6s3vk9x58YxfXoDtVl_14nnkL4G6ghoohIFu0RB0pBoCI6_ewOGCw473ZXP/exec";
        let menu = [];

        async function loadAdminMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                menu = await res.json();
                renderAdminList();
            } catch (e) {}
        }

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = menu.map(item => `
                <div class="flex items-center justify-between p-3 bg-white rounded-2xl border">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="prepareEdit('${item.id}')">
                        <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover">
                        <div>
                            <p class="font-bold text-sm">${item.name}</p>
                            <p class="text-[10px] text-gray-400">${item.category} | ${item.description || ''}</p>
                        </div>
                    </div>
                    <button onclick="deleteItem('${item.id}')" class="text-red-500 p-2"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        async function saveFood() {
            const data = {
                action: "update",
                id: document.getElementById('foodId').value || "ID-" + Date.now(),
                name: document.getElementById('foodName').value,
                description: document.getElementById('foodDesc').value,
                price: document.getElementById('foodPrice').value,
                category: document.getElementById('foodCat').value,
                img: document.getElementById('foodImg').value,
                status: "visible"
            };
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            resetForm(); setTimeout(loadAdminMenu, 1000);
        }

        function prepareEdit(id) {
            const item = menu.find(i => String(i.id) === String(id));
            document.getElementById('foodId').value = item.id;
            document.getElementById('foodName').value = item.name;
            document.getElementById('foodDesc').value = item.description || "";
            document.getElementById('foodPrice').value = item.price;
            document.getElementById('foodCat').value = item.category;
            document.getElementById('foodImg').value = item.img;
            window.scrollTo(0,0);
        }

        function resetForm() {
            document.getElementById('foodId').value = "";
            document.getElementById('foodName').value = "";
            document.getElementById('foodDesc').value = "";
            document.getElementById('foodPrice').value = "";
            document.getElementById('foodImg').value = "";
        }

        setInterval(loadAdminMenu, 3000); 
        loadAdminMenu();
    </script>
</body>
</html>
