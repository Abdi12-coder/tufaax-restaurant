<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tufaax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4 pb-20">
    <div class="max-w-xl mx-auto space-y-6">
        <header class="bg-gray-800 text-white p-6 rounded-3xl shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black italic">🍎 TUFAAX ADMIN</h1>
                <p class="text-[10px] text-gray-400">Maamul menu-ga si sax ah</p>
            </div>
            <button onclick="loadAdminMenu()" class="bg-gray-700 hover:bg-gray-600 transition p-2 rounded-full w-10 h-10 flex items-center justify-center">
                <i class="fas fa-sync-alt"></i>
            </button>
        </header>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 space-y-4">
            <h2 id="form-title" class="font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto Cusub
            </h2>
            <div class="space-y-3">
                <input id="foodId" type="hidden"> 
                <input id="foodStatus" type="hidden" value="visible">
                <input id="foodName" type="text" placeholder="Magaca Cuntada" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                <div class="grid grid-cols-2 gap-3">
                    <input id="foodPrice" type="number" step="0.01" placeholder="Qiimaha $" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                    <select id="foodCat" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                        <option>Quraac</option><option>Qado</option><option>Casho</option><option>Cabitaan</option><option>Macmacaan</option>
                    </select>
                </div>
                <input id="foodImg" type="text" placeholder="Link-ga Sawirka (URL)" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                <div class="flex gap-2">
                    <button id="saveBtn" onclick="saveFood()" class="flex-1 bg-green-500 text-white p-5 rounded-2xl font-bold shadow-lg">KEYDI XOGTA</button>
                    <button id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-200 text-gray-600 px-6 rounded-2xl font-bold">Xir</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
            <h2 class="font-bold text-gray-800 mb-4 flex justify-between items-center">
                <span>Cuntooyinka Hadda Jira</span>
                <span id="item-count" class="text-xs bg-gray-100 px-2 py-1 rounded-full text-gray-500">0</span>
            </h2>
            <div id="admin-list" class="space-y-3">
                <p class="text-center py-5 text-gray-400 italic">Xogta waa la soo ridaybaa...</p>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzN7tYUEMrPtYhRXZwt0z5--8vUKL1Gl35Ixa8WWzesIbReJUa2f9aZWjZF7Gu3iQYH/exec";
        let menu = [];

        async function loadAdminMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                menu = await res.json();
                document.getElementById('item-count').innerText = menu.length;
                renderAdminList();
            } catch (e) { 
                document.getElementById('admin-list').innerHTML = "<p class='text-red-500 text-center'>Xogta waa la waayay.</p>";
            }
        }

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = menu.map((item) => `
                <div class="flex items-center justify-between p-3 ${item.status === 'hidden' ? 'bg-red-50 opacity-60' : 'bg-gray-50'} rounded-2xl border">
                    <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="prepareEdit('${item.id}')">
                        <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover" onerror="this.src='https://via.placeholder.com/150'">
                        <div>
                            <p class="font-bold text-sm">${item.name || 'Magac la\'aan'}</p>
                            <p class="text-xs text-green-600">$${parseFloat(item.price || 0).toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleVisibility('${item.id}')" class="p-2 text-[10px] font-bold border rounded-xl bg-white">
                            ${item.status === 'hidden' ? 'SHOW' : 'HIDE'}
                        </button>
                        <button onclick="deleteFood('${item.id}')" class="p-2 text-red-500">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function prepareEdit(id) {
            const item = menu.find(i => String(i.id) === String(id));
            if(!item) return;
            document.getElementById('foodId').value = item.id;
            document.getElementById('foodName').value = item.name;
            document.getElementById('foodPrice').value = item.price;
            document.getElementById('foodCat').value = item.category;
            document.getElementById('foodImg').value = item.img;
            document.getElementById('foodStatus').value = item.status || "visible";
            document.getElementById('form-title').innerText = "Bedel: " + item.name;
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function saveFood() {
            const btn = document.getElementById('saveBtn');
            const data = {
                action: "update",
                id: document.getElementById('foodId').value || "ID-" + Date.now(),
                name: document.getElementById('foodName').value,
                price: document.getElementById('foodPrice').value,
                category: document.getElementById('foodCat').value,
                img: document.getElementById('foodImg').value,
                status: document.getElementById('foodStatus').value
            };
            if(!data.name || !data.price) return alert("Fadlan buuxi magaca iyo qiimaha");
            
            btn.innerText = "KEYDINTA...";
            btn.disabled = true;

            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            
            setTimeout(() => {
                resetForm();
                loadAdminMenu();
                btn.innerText = "KEYDI XOGTA";
                btn.disabled = false;
            }, 1500);
        }

        async function deleteFood(id) {
            if(!confirm("Ma hubtaa?")) return;
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", id: String(id) }) });
            setTimeout(loadAdminMenu, 1000);
        }

        async function toggleVisibility(id) {
            const item = menu.find(i => String(i.id) === String(id));
            const newStatus = item.status === 'hidden' ? 'visible' : 'hidden';
            const updatedItem = { ...item, action: "update", status: newStatus };
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(updatedItem) });
            setTimeout(loadAdminMenu, 1000);
        }

        function resetForm() {
            document.getElementById('foodId').value = "";
            document.getElementById('foodName').value = "";
            document.getElementById('foodPrice').value = "";
            document.getElementById('foodImg').value = "";
            document.getElementById('foodStatus').value = "visible";
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('form-title').innerText = "Ku dar Cunto Cusub";
        }

        loadAdminMenu();
    </script>
</body>
</html>
