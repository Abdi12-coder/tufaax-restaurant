<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tufaax Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-xl mx-auto space-y-6">
        <header class="bg-red-600 text-white p-6 rounded-3xl shadow-lg flex justify-between items-center">
            <h1 class="text-xl font-bold">🍎 Cashier Panel</h1>
            <a href="index.html" class="text-xs bg-red-800 px-3 py-1 rounded-full text-white">View Menu</a>
        </header>

        <div class="bg-white p-6 rounded-3xl shadow-sm space-y-4">
            <h2 class="font-bold text-gray-700">Ku dar Cunto Cusub</h2>
            <input id="foodName" type="text" placeholder="Magaca Cuntada" class="w-full p-3 border rounded-xl outline-none">
            <div class="grid grid-cols-2 gap-3">
                <input id="foodPrice" type="number" placeholder="Qiimaha $" class="p-3 border rounded-xl outline-none">
                <select id="foodCat" class="p-3 border rounded-xl outline-none">
                    <option>Quraac</option><option>Qado</option><option>Casho</option><option>Cabitaan</option>
                </select>
            </div>
            <input id="foodImg" type="text" placeholder="Link-ga Sawirka (URL)" class="w-full p-3 border rounded-xl outline-none">
            <button onclick="saveFood()" class="w-full bg-green-500 text-white p-4 rounded-xl font-bold shadow-lg">KEYDI CUNTADA</button>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm">
            <h2 class="font-bold text-gray-700 mb-4 border-b pb-2">Cuntooyinka yaala (Tirtir kuwa dhamaaday)</h2>
            <div id="admin-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        let menu = JSON.parse(localStorage.getItem('tufaax_menu')) || [];

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = menu.map((item, index) => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100">
                    <div class="flex items-center gap-3">
                        <img src="${item.img}" class="w-12 h-12 rounded-lg object-cover">
                        <div>
                            <p class="font-bold text-sm text-gray-800">${item.name}</p>
                            <p class="text-[10px] text-red-500 font-bold">$${item.price.toFixed(2)}</p>
                        </div>
                    </div>
                    <button onclick="deleteFood(${index})" class="bg-red-100 text-red-600 p-2 rounded-lg hover:bg-red-200">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function saveFood() {
            const name = document.getElementById('foodName').value;
            const price = parseFloat(document.getElementById('foodPrice').value);
            const cat = document.getElementById('foodCat').value;
            const img = document.getElementById('foodImg').value || "https://via.placeholder.com/150?text=Cunto";

            if(name && price) {
                menu.push({ id: Date.now(), name, price, category: cat, desc: "Cunto macaan", img });
                localStorage.setItem('tufaax_menu', JSON.stringify(menu));
                renderAdminList();
                document.getElementById('foodName').value = '';
                document.getElementById('foodPrice').value = '';
                alert("Waa lagu daray!");
            }
        }

        function deleteFood(index) {
            if(confirm("Ma hubtaa inaad tirtirto?")) {
                menu.splice(index, 1);
                localStorage.setItem('tufaax_menu', JSON.stringify(menu));
                renderAdminList();
            }
        }
        renderAdminList();
    </script>
</body>
</html>
