<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tufaax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .processing { opacity: 0.4; pointer-events: none; }
        #custom-popup { display: none; }
    </style>
</head>
<body class="bg-slate-50 p-4 pb-20">
    <div id="custom-popup" class="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full shadow-2xl text-center">
            <div id="popup-icon-box" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner">
                <i id="popup-icon" class="fas text-3xl"></i>
            </div>
            <h3 id="popup-title" class="font-black text-xl text-gray-800">Ma hubtaa?</h3>
            <p id="popup-msg" class="text-gray-500 mt-2 leading-relaxed">Falkan dib looma soo celin karo.</p>
            <div class="flex gap-3 mt-8">
                <button onclick="closePopup()" class="flex-1 bg-gray-100 p-4 rounded-2xl font-bold text-gray-600 active:scale-95 transition">Xir</button>
                <button id="popup-confirm-btn" class="flex-1 p-4 rounded-2xl font-bold text-white shadow-lg active:scale-95 transition">Haa, Samee</button>
            </div>
        </div>
    </div>

    <div class="max-w-xl mx-auto space-y-6">
        <header class="bg-gray-800 text-white p-6 rounded-[2rem] shadow-xl flex justify-between items-center">
            <div><h1 class="text-xl font-black italic">🍎 TUFAAX ADMIN</h1><p class="text-[10px] text-gray-400">Maamul xogta si toos ah</p></div>
            <div id="sync-indicator" class="text-green-400 text-[10px] flex items-center gap-1 font-bold"><i class="fas fa-circle text-[6px] animate-pulse"></i> LIVE</div>
        </header>

        <div class="bg-white p-2 rounded-2xl shadow-sm border border-gray-100 flex items-center px-4">
            <i class="fas fa-search text-gray-400 mr-2"></i>
            <input type="text" id="adminSearch" oninput="renderAdminList()" placeholder="Raadi cunto..." class="w-full p-2 outline-none bg-transparent text-sm">
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 space-y-4">
            <h2 id="form-title" class="font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto Cusub</h2>
            <div class="space-y-3">
                <input id="foodId" type="hidden"> 
                <input id="foodStatus" type="hidden" value="visible">
                <input id="foodName" type="text" placeholder="Magaca Cuntada" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                
                <textarea id="foodDesc" placeholder="Faahfaahinta Cuntada (Description)" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400 h-20 resize-none"></textarea>

                <div class="grid grid-cols-2 gap-3">
                    <input id="foodPrice" type="number" step="0.01" placeholder="Qiimaha $" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                    <select id="foodCat" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400">
                        <option>Quraac</option><option>Qado</option><option>Casho</option><option>Cabitaan</option><option>Macmacaan</option>
                    </select>
                </div>
                <input id="foodImg" type="text" placeholder="Link-ga Sawirka (URL)" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none">
                <label class="block w-full bg-blue-50 text-blue-600 p-4 rounded-2xl border border-dashed border-blue-200 cursor-pointer text-center">
                    <i class="fas fa-upload mr-2"></i> <span id="uploadStatus">Upload Sawir</span>
                    <input type="file" accept="image/*" class="hidden" onchange="uploadImage(this)">
                </label>
                <div class="flex gap-2">
                    <button id="saveBtn" onclick="saveFood()" class="flex-1 bg-green-500 text-white p-5 rounded-2xl font-bold shadow-lg">KEYDI XOGTA</button>
                    <button id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-200 text-gray-600 px-6 rounded-2xl font-bold">Xir</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
            <div id="admin-list" class="space-y-3"><p class="text-center py-5 text-gray-400 italic">Xogta waa la soo ridaybaa...</p></div>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbxFfrF8ML0UNNw0rPucw-O1bsvUCRek69jD82DmixgYjjR3mMb22g0mj-rTRncylf1f/exec";
        let menu = [];

        function uploadImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { document.getElementById('foodImg').value = e.target.result; document.getElementById('uploadStatus').innerText = "✅ Diyaar"; };
                reader.readAsDataURL(file);
            }
        }

        async function loadAdminMenu() {
            try {
                const res = await fetch(GOOGLE_URL);
                const newData = await res.json();
                if (JSON.stringify(menu) !== JSON.stringify(newData)) {
                    menu = newData;
                    renderAdminList();
                }
            } catch (e) {}
        }

        function renderAdminList() {
            const searchTerm = document.getElementById('adminSearch').value.toLowerCase();
            const list = document.getElementById('admin-list');
            const filtered = menu.filter(item => item.name.toLowerCase().includes(searchTerm));
            list.innerHTML = filtered.map(item => `
                <div id="row-${item.id}" class="flex items-center justify-between p-3 ${item.status === 'hidden' ? 'bg-red-50' : 'bg-gray-50'} rounded-2xl border">
                    <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="prepareEdit('${item.id}')">
                        <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover">
                        <div>
                            <p class="font-bold text-sm text-gray-800">${item.name}</p>
                            <p class="text-[10px] text-gray-500 truncate w-32">${item.description || ''}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="triggerPopup('status', '${item.id}')" class="px-2 py-1 text-[9px] font-bold border rounded-lg bg-white">${item.status === 'hidden' ? 'SHOW' : 'HIDE'}</button>
                        <button onclick="triggerPopup('delete', '${item.id}')" class="text-red-500 p-2"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>`).join('');
        }

        async function saveFood() {
            const btn = document.getElementById('saveBtn');
            const data = {
                action: "update",
                id: document.getElementById('foodId').value || "ID-" + Date.now(),
                name: document.getElementById('foodName').value,
                description: document.getElementById('foodDesc').value, // Sent to Script
                price: document.getElementById('foodPrice').value,
                category: document.getElementById('foodCat').value,
                img: document.getElementById('foodImg').value,
                status: document.getElementById('foodStatus').value
            };
            btn.innerText = "KEYDINAYAA...";
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            setTimeout(() => { resetForm(); loadAdminMenu(); btn.innerText = "KEYDI XOGTA"; }, 800);
        }

        function prepareEdit(id) {
            const item = menu.find(i => String(i.id) === String(id));
            document.getElementById('foodId').value = item.id;
            document.getElementById('foodName').value = item.name;
            document.getElementById('foodDesc').value = item.description || ""; // Loaded description
            document.getElementById('foodPrice').value = item.price;
            document.getElementById('foodCat').value = item.category;
            document.getElementById('foodImg').value = item.img;
            document.getElementById('foodStatus').value = item.status || "visible";
            document.getElementById('form-title').innerText = "Bedel Cuntada";
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('foodId').value = "";
            document.getElementById('foodName').value = "";
            document.getElementById('foodDesc').value = "";
            document.getElementById('foodPrice').value = "";
            document.getElementById('foodImg').value = "";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function triggerPopup(type, id) {
            document.getElementById('custom-popup').style.display = 'flex';
            document.getElementById('popup-confirm-btn').onclick = async () => {
                if(type === 'delete') {
                    await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", id: String(id) }) });
                } else {
                    const item = menu.find(i => String(i.id) === String(id));
                    const newStatus = item.status === 'hidden' ? 'visible' : 'hidden';
                    await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ ...item, action: "update", status: newStatus }) });
                }
                closePopup(); loadAdminMenu();
            };
        }
        function closePopup() { document.getElementById('custom-popup').style.display = 'none'; }

        setInterval(loadAdminMenu, 500); // Fast refresh 0.5 sec
        loadAdminMenu();
    </script>
</body>
</html>
