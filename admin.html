<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tufaax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .processing { opacity: 0.4; pointer-events: none; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #custom-popup { display: none; }
    </style>
</head>
<body class="bg-slate-50 p-4 pb-20">

    <div id="custom-popup" class="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full shadow-2xl text-center">
            <div id="popup-icon-box" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner">
                <i id="popup-icon" class="fas text-3xl"></i>
            </div>
            <h3 id="popup-title" class="font-black text-xl text-gray-800">Ma hubtaa?</h3>
            <p id="popup-msg" class="text-gray-500 mt-2 leading-relaxed">Falkan dib looma soo celin karo.</p>
            <div class="flex gap-3 mt-8">
                <button onclick="closePopup()" class="flex-1 bg-gray-100 p-4 rounded-2xl font-bold text-gray-600 active:scale-95 transition">Xir</button>
                <button id="popup-confirm-btn" class="flex-1 p-4 rounded-2xl font-bold text-white shadow-lg active:scale-95 transition">Haa, Samee</button>
            </div>
        </div>
    </div>

    <div class="max-w-xl mx-auto space-y-6">
        <header class="bg-gray-800 text-white p-6 rounded-[2rem] shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black italic text-red-500">🍎 TUFAAX ADMIN</h1>
                <p class="text-[10px] text-gray-400">Maamul xogta si toos ah</p>
            </div>
            <div id="sync-indicator" class="text-green-400 text-[10px] flex items-center gap-1 font-bold">
                <i class="fas fa-circle text-[6px] animate-pulse"></i> LIVE
            </div>
        </header>

        <div class="relative">
            <i class="fas fa-search absolute left-4 top-4 text-gray-400"></i>
            <input type="text" id="adminSearch" oninput="renderAdminList()" placeholder="Raadi cunto..." class="w-full p-4 pl-12 bg-white rounded-2xl border-none shadow-sm outline-none focus:ring-2 focus:ring-green-400">
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 space-y-4">
            <h2 id="form-title" class="font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto Cusub
            </h2>
            <div class="space-y-3">
                <input id="foodId" type="hidden"> 
                <input id="foodStatus" type="hidden" value="visible">
                <input id="foodName" type="text" placeholder="Magaca Cuntada" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400 transition-all">
                <div class="grid grid-cols-2 gap-3">
                    <input id="foodPrice" type="number" step="0.01" placeholder="Qiimaha $" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400 transition-all">
                    <select id="foodCat" class="p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400 transition-all">
                        <option>Quraac</option><option>Qado</option><option>Casho</option><option>Cabitaan</option><option>Macmacaan</option>
                    </select>
                </div>
                
                <div class="space-y-2">
                    <input id="foodImg" type="text" placeholder="Link-ga Sawirka (URL)" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-400 transition-all">
                    <div class="flex items-center gap-2 p-4 bg-gray-100 rounded-2xl border-2 border-dashed border-gray-300">
                        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileUpload(this)">
                        <label for="fileInput" class="cursor-pointer flex items-center gap-2 text-gray-600 font-bold text-sm w-full">
                            <i class="fas fa-upload"></i> <span id="fileName">Ama Sawir ka soo upload gareey files-kaaga</span>
                        </label>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="saveBtn" onclick="saveFood()" class="flex-1 bg-green-500 text-white p-5 rounded-2xl font-bold shadow-lg active:scale-95 transition">KEYDI XOGTA</button>
                    <button id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-200 text-gray-600 px-6 rounded-2xl font-bold active:scale-95 transition">Xir</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
            <h2 class="font-bold text-gray-800 mb-4 flex justify-between items-center">
                <span>Cuntooyinka Hadda Jira</span>
                <span id="item-count" class="text-xs bg-gray-100 px-3 py-1 rounded-full text-gray-500 font-bold">0</span>
            </h2>
            <div id="admin-list" class="space-y-3">
                <p class="text-center py-5 text-gray-400 italic">Xogta waa la soo ridaybaa...</p>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzN7tYUEMrPtYhRXZwt0z5--8vUKL1Gl35Ixa8WWzesIbReJUa2f9aZWjZF7Gu3iQYH/exec";
        let menu = [];
        let uploadedImgBase64 = "";

        // Function loogu talagalay Upload-ka
        function handleFileUpload(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('fileName').innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImgBase64 = e.target.result;
                    document.getElementById('foodImg').value = "Sawir cusub ayaa la doortay...";
                };
                reader.readAsDataURL(file);
            }
        }

        async function loadAdminMenu(isSilent = false) {
            try {
                const res = await fetch(GOOGLE_URL);
                const newData = await res.json();
                if (JSON.stringify(menu) !== JSON.stringify(newData)) {
                    menu = newData;
                    document.getElementById('item-count').innerText = menu.length;
                    renderAdminList();
                }
            } catch (e) { console.error("Sync error"); }
        }

        function renderAdminList() {
            const query = document.getElementById('adminSearch').value.toLowerCase();
            const list = document.getElementById('admin-list');
            const filtered = menu.filter(item => (item.name || '').toLowerCase().includes(query));

            list.innerHTML = filtered.map((item) => `
                <div id="row-${item.id}" class="flex items-center justify-between p-3 ${item.status === 'hidden' ? 'bg-red-50 opacity-60' : 'bg-gray-50'} rounded-2xl border transition-all duration-300">
                    <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="prepareEdit('${item.id}')">
                        <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover shadow-sm" onerror="this.src='https://via.placeholder.com/150'">
                        <div>
                            <p class="font-bold text-sm text-gray-800">${item.name || 'Bilaa Magac'}</p>
                            <p class="text-xs text-green-600 font-bold">$${parseFloat(item.price || 0).toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="triggerPopup('status', '${item.id}')" class="px-3 py-2 text-[10px] font-black border rounded-xl bg-white shadow-sm active:scale-90 transition">
                            ${item.status === 'hidden' ? 'SHOW' : 'HIDE'}
                        </button>
                        <button onclick="triggerPopup('delete', '${item.id}')" class="p-2 text-red-500 active:scale-90 transition">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function triggerPopup(type, id) {
            const popup = document.getElementById('custom-popup');
            const confirmBtn = document.getElementById('popup-confirm-btn');
            const title = document.getElementById('popup-title');
            const msg = document.getElementById('popup-msg');
            const icon = document.getElementById('popup-icon');
            const iconBox = document.getElementById('popup-icon-box');

            popup.style.display = 'flex';

            if(type === 'delete') {
                title.innerText = "Ma hubtaa?";
                msg.innerText = "Cuntadan si joogto ah ayaa looga tirtirayaa Menu-ga.";
                confirmBtn.innerText = "Haa, Tirtir";
                confirmBtn.className = "flex-1 bg-red-500 p-4 rounded-2xl font-bold text-white shadow-lg active:scale-95 transition";
                icon.className = "fas fa-trash-alt text-3xl";
                iconBox.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 bg-red-50 text-red-500 shadow-inner";
                confirmBtn.onclick = () => { deleteFood(id); closePopup(); };
            } else {
                title.innerText = "Badal Muuqaalka?";
                msg.innerText = "Ma hubtaa inaad bedesho sida ay cuntadan macaamiisha ugu muuqato?";
                confirmBtn.innerText = "Haa, Bedel";
                confirmBtn.className = "flex-1 bg-blue-600 p-4 rounded-2xl font-bold text-white shadow-lg active:scale-95 transition";
                icon.className = "fas fa-eye text-3xl";
                iconBox.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 bg-blue-50 text-blue-600 shadow-inner";
                confirmBtn.onclick = () => { toggleVisibility(id); closePopup(); };
            }
        }

        function closePopup() { document.getElementById('custom-popup').style.display = 'none'; }

        async function deleteFood(id) {
            document.getElementById(`row-${id}`).classList.add('processing');
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", id: String(id) }) });
            setTimeout(() => loadAdminMenu(true), 1500);
        }

        async function toggleVisibility(id) {
            document.getElementById(`row-${id}`).classList.add('processing');
            const item = menu.find(i => String(i.id) === String(id));
            const newStatus = item.status === 'hidden' ? 'visible' : 'hidden';
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ ...item, action: "update", status: newStatus }) });
            setTimeout(() => loadAdminMenu(true), 1500);
        }

        function prepareEdit(id) {
            const item = menu.find(i => String(i.id) === String(id));
            if(!item) return;
            document.getElementById('foodId').value = item.id;
            document.getElementById('foodName').value = item.name;
            document.getElementById('foodPrice').value = item.price;
            document.getElementById('foodCat').value = item.category;
            document.getElementById('foodImg').value = item.img;
            document.getElementById('foodStatus').value = item.status || "visible";
            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit text-orange-400"></i> Bedel: ${item.name}`;
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function saveFood() {
            const btn = document.getElementById('saveBtn');
            const data = {
                action: "update",
                id: document.getElementById('foodId').value || "ID-" + Date.now(),
                name: document.getElementById('foodName').value,
                price: document.getElementById('foodPrice').value,
                category: document.getElementById('foodCat').value,
                img: uploadedImgBase64 || document.getElementById('foodImg').value,
                status: document.getElementById('foodStatus').value
            };
            if(!data.name || !data.price) return;
            
            btn.innerText = "KEYDINTA...";
            btn.classList.add('processing');
            await fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            
            setTimeout(() => {
                resetForm();
                loadAdminMenu(true);
                btn.innerText = "KEYDI XOGTA";
                btn.classList.remove('processing');
            }, 1000);
        }

        function resetForm() {
            document.getElementById('foodId').value = "";
            document.getElementById('foodName').value = "";
            document.getElementById('foodPrice').value = "";
            document.getElementById('foodImg').value = "";
            uploadedImgBase64 = "";
            document.getElementById('fileName').innerText = "Ama Sawir ka soo upload gareey files-kaaga";
            document.getElementById('foodStatus').value = "visible";
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('form-title').innerHTML = `<i class="fas fa-plus-circle text-green-500"></i> Ku dar Cunto Cusub`;
        }

        setInterval(() => loadAdminMenu(true), 1000);
        loadAdminMenu();
    </script>
</body>
</html>
